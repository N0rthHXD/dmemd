openapi: 3.0.3
info:
  title: dmemd local memory service
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Local HTTP/1.1 JSON contract for dmemd.

    The data model follows four explicit layers:

      Source -> L0 Observation -> Canonical Memory -> Derived Memory (L1-L4)

    Observations are raw extraction records and are never edited through HTTP.
    Canonical memories are the current governed view. Derived memories are
    asynchronous aggregates and expose their exact typed dependencies. An
    extraction job reports only its own stage; governance and aggregation
    progress is queried through the governance-jobs endpoints.

    There is no authentication. Authorization headers are optional and ignored.
servers:
  - url: http://127.0.0.1:18432
security: []
tags:
  - name: ingest
    description: Source submission and extraction jobs
  - name: observations
    description: L0 raw observations, their evidence and relations
  - name: memories
    description: Canonical current views, history, evidence and recall
  - name: derived
    description: L1-L4 derived memories, dependencies and generation targets
  - name: conflicts
    description: Open contradictions and explicit human adjudication
  - name: sources
    description: Original submissions, stable spans and redaction
  - name: experiences
    description: Application-reported completion results and retraction
  - name: skills
    description: Rendered guidance skills with traceable sources
  - name: jobs
    description: Extraction, governance and aggregation task views
  - name: embedding
    description: Semantic-index configuration, coverage and degradation diagnostics
  - name: health
    description: Process liveness and database readiness

paths:
  /v1/ingestions:
    post:
      tags: [ingest]
      summary: Submit arbitrary JSON content for background extraction
      description: |
        Saves the source and an extraction job in one transaction and returns
        202. No model is called and no memory is created synchronously. The
        extraction worker later creates L0 observations; governance and
        aggregation continue asynchronously through their own task tables.
      operationId: createIngestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '202':
          description: Source and extraction job persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/observations:
    get:
      tags: [observations]
      summary: List L0 raw observations
      description: |
        Read-only view of the L0 layer. Observations are immutable raw records
        extracted from a source; their content is never editable through HTTP.
      operationId: listObservations
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
        - name: scope_key
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [fact, preference, event, procedure]
        - name: status
          in: query
          schema:
            type: string
            enum: [observed, pending, retracted, deleted]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Observation page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/observations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [observations]
      summary: Read one L0 observation
      operationId: getObservation
      responses:
        '200':
          description: Observation record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/observations/{id}/evidence:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [observations]
      summary: Read the code-generated evidence of one observation
      description: |
        Evidence is generated only from selected source spans. A model quote,
        offset or identifier is never accepted as evidence.
      operationId: getObservationEvidence
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/observations/{id}/relations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [observations]
      summary: Read typed relations touching one observation
      operationId: getObservationRelations
      responses:
        '200':
          description: Typed relation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories:
    get:
      tags: [memories]
      summary: List canonical current memories
      description: |
        Only the current governed view is returned. There is no raw extraction
        content here; use /v1/observations for L0 records. Default state set is
        active+archived; deleted tombstones require an explicit states filter.
      operationId: listMemories
      parameters:
        - name: kinds
          in: query
          description: Comma-separated fact,preference,event,procedure
          schema:
            type: string
        - name: states
          in: query
          description: Comma-separated active,archived,deleted
          schema:
            type: string
        - name: assertion_status
          in: query
          description: Comma-separated accepted,pending,rejected
          schema:
            type: string
        - name: updated_after
          in: query
          schema:
            type: string
            format: date-time
        - name: updated_before
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Current memory page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/recall:
    post:
      tags: [memories]
      summary: Layered recall for observations, canonical memories and L1-L4
      description: |
        Returns independent partitions instead of one mixed ranking. query_mode
        selects a fixed default layer set; explicit layers take precedence.
        Each selected partition receives its own top_k bound. Stale derived
        memories are not returned as current conclusions unless explicitly
        requested through derived_states.
      operationId: recallMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallRequest'
      responses:
        '200':
          description: Layered recall result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecallResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts:
    get:
      tags: [derived]
      summary: List current derived memories
      operationId: listArtifacts
      parameters:
        - name: scope_key
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [local_summary, topic_summary, scope_summary, profile, experience_case, skill, guidance]
        - name: state
          in: query
          schema:
            type: string
            enum: [active, stale, disabled]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Derived-memory page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifact-targets:
    get:
      tags: [derived]
      summary: List derived generation targets
      operationId: listArtifactTargets
      parameters:
        - name: scope_key
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [local_summary, topic_summary, scope_summary, profile, experience_case, skill, guidance]
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, waiting, active, stale, disabled,
              no_eligible_input, model_unavailable, generation_failed, invalid_output]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Target page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactTargetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [derived]
      summary: Read one derived memory, its current revision and dependencies
      operationId: getArtifact
      responses:
        '200':
          description: Derived memory detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{id}/history/{version}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [derived]
      summary: Read one historical derived revision and its dependencies
      operationId: getArtifactHistoryEntry
      responses:
        '200':
          description: Historical derived detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/experiences:
    post:
      tags: [experiences]
      summary: Submit one application-reported result
      operationId: createExperience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceSubmit'
      responses:
        '202':
          description: Saved application report receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/experiences/{id}/retract:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [experiences]
      summary: Revoke one application report
      operationId: retractExperience
      responses:
        '200':
          description: Revoked receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/skills/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [skills]
      summary: Read one rendered SKILL.md guidance document
      operationId: getSkillContent
      parameters:
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Rendered skill content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: Read the canonical current view and its references
      description: |
        Returns the current governed snapshot plus its observation source IDs,
        typed relation refs, open conflict IDs and directly derived dependents.
        The memory content itself is immutable through this endpoint.
      operationId: getMemory
      responses:
        '200':
          description: Canonical memory detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [memories]
      summary: Logically delete a memory
      operationId: deleteMemory
      responses:
        '200':
          description: Logical delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/state:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    patch:
      tags: [memories]
      summary: Change lifecycle state only
      operationId: setMemoryState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatePatch'
      responses:
        '200':
          description: Updated current memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/purge:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    post:
      tags: [memories]
      summary: Permanently purge one memory and its dedicated data
      operationId: purgeMemory
      responses:
        '200':
          description: Purge confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: List immutable memory revisions
      operationId: listMemoryHistory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Revision list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history/{version}:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [memories]
      summary: Read one immutable memory revision
      operationId: getMemoryHistoryEntry
      responses:
        '200':
          description: Revision snapshot and evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [memories]
      summary: Restore a historical revision as a new current version
      operationId: restoreMemoryVersion
      responses:
        '200':
          description: New current memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: Read the evidence set of one memory revision
      operationId: getMemoryEvidence
      parameters:
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts:
    get:
      tags: [conflicts]
      summary: List memory conflicts
      operationId: listConflicts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved]
            default: open
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Conflict list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [conflicts]
      summary: Read one conflict with members and events
      operationId: getConflict
      responses:
        '200':
          description: Conflict detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [conflicts]
      summary: Explicitly adjudicate one conflict
      operationId: resolveConflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolveRequest'
      responses:
        '200':
          description: Updated conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictStale'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/forget:
    post:
      tags: [memories]
      summary: Permanently forget the requested closure
      operationId: forget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetRequest'
      responses:
        '200':
          description: Actually removed identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [sources]
      summary: Read one source, its stable spans and redaction status
      operationId: getSource
      responses:
        '200':
          description: Source record with stable spans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [sources]
      summary: Redact original content and cancel unfinished jobs
      operationId: redactSource
      responses:
        '200':
          description: Redaction and invalidation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/jobs:
    get:
      tags: [jobs]
      summary: List extraction jobs
      description: |
        Extraction jobs report only their extraction stage. Governance and
        aggregation progress is queried through /v1/governance-jobs.
      operationId: listJobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, waiting, succeeded, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Extraction job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [jobs]
      summary: Read one extraction job
      operationId: getJob
      responses:
        '200':
          description: Extraction job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/governance-jobs:
    get:
      tags: [jobs]
      summary: List governance and aggregation tasks
      operationId: listGovernanceJobs
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [governance, aggregation]
        - name: kind
          in: query
          schema:
            type: string
            enum: [govern_observation, classify_observation, aggregate_l1,
              aggregate_l2, aggregate_l3, build_guidance, review_conflict,
              invalidate_dependency, reconcile]
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, waiting, succeeded, failed, cancelled]
        - name: target_key
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/governance-jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [jobs]
      summary: Read one governance or aggregation task
      operationId: getGovernanceJob
      responses:
        '200':
          description: Governance or aggregation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/ingest-jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [jobs]
      summary: Read one extraction job through the historical path
      operationId: getIngestJob
      responses:
        '200':
          description: Extraction job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/embedding/status:
    get:
      tags: [embedding]
      summary: Read semantic-index status
      operationId: getEmbeddingStatus
      responses:
        '200':
          description: Embedding status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingStatus'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/embedding/probe:
    post:
      tags: [embedding]
      summary: Probe the configured embedding endpoint
      operationId: probeEmbedding
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProbe'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /healthz:
    get:
      tags: [health]
      summary: Process liveness
      operationId: healthz
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [health]
      summary: Database readiness
      operationId: readyz
      responses:
        '200':
          description: Database is usable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is not usable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  parameters:
    MemoryID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Request body or query value is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource or version does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal execution failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictStale:
      description: Conflict revision or member versions changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Service or database is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]

    SubmitRequest:
      type: object
      properties:
        app_id:
          type: string
        external_id:
          type: string
        scope_key:
          type: string
        content:
          description: Arbitrary JSON content, including null
      additionalProperties: true

    SubmitResponse:
      type: object
      required: [source_id, job_id, status]
      properties:
        source_id:
          type: string
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]

    Memory:
      type: object
      description: Current canonical memory view produced by governance
      required: [id, kind, title, content, state, assertion_status, version, created_at, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [fact, preference, event, procedure]
        title:
          type: string
        content:
          type: string
        state:
          type: string
          enum: [active, archived, deleted]
        assertion_status:
          type: string
          enum: [accepted, pending, rejected]
        version:
          type: integer
          minimum: 1
        scope_key:
          type: string
        origin_source_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'

    Relation:
      type: object
      description: Typed relation between observations and/or memories
      required: [id, kind, from_type, from_id, from_version, to_type, to_id, to_version, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [duplicate, supports, enriches, supersedes, contradicts, separate, independent, unresolved]
        from_type:
          type: string
          enum: [observation, memory]
        from_id:
          type: string
        from_version:
          type: integer
        to_type:
          type: string
          enum: [observation, memory]
        to_id:
          type: string
        to_version:
          type: integer
        created_at:
          type: string
          format: date-time

    RelationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relation'

    DerivedDependent:
      type: object
      required: [id, layer, kind, target_key, version, state]
      properties:
        id:
          type: string
        layer:
          type: string
          enum: [l1, l2, l3, l4]
        kind:
          type: string
          enum: [local_summary, topic_summary, scope_summary, profile, experience_case, skill, guidance]
        target_key:
          type: string
        scope_key:
          type: string
        topic:
          type: string
        version:
          type: integer
        state:
          type: string
          enum: [active, stale, disabled]

    MemoryDetail:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          required: [observation_ids, relations, conflict_ids, derived_dependents]
          properties:
            observation_ids:
              type: array
              items:
                type: string
            relations:
              type: array
              items:
                $ref: '#/components/schemas/Relation'
            conflict_ids:
              type: array
              items:
                type: string
            derived_dependents:
              type: array
              items:
                $ref: '#/components/schemas/DerivedDependent'

    StatePatch:
      type: object
      properties:
        state:
          type: string
          enum: [active, archived]

    DeleteResponse:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [deleted]

    PurgeResponse:
      type: object
      required: [id, purged]
      properties:
        id:
          type: string
        purged:
          type: boolean

    Evidence:
      type: object
      required: [id, source_id, redacted, created_at]
      properties:
        id:
          type: string
        source_id:
          type: string
        segment_id:
          type: string
        message_id:
          type: string
        quote:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        redacted:
          type: boolean
        redacted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Location:
      type: object
      required: [start, end]
      properties:
        field:
          type: string
        start:
          type: integer
        end:
          type: integer

    EvidenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'

    Revision:
      type: object
      required: [memory_id, version, operation, snapshot, evidence, created_at]
      properties:
        memory_id:
          type: string
        version:
          type: integer
        operation:
          type: string
          enum: [create, update, add_evidence, archive, activate, delete, restore, resolve, classify]
        reason:
          type: string
        snapshot:
          $ref: '#/components/schemas/Memory'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        created_at:
          type: string
          format: date-time

    RevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'

    Observation:
      type: object
      description: Immutable L0 raw memory extracted from one source
      required: [id, source_id, kind, content, content_mode, status, created_at, updated_at]
      properties:
        id:
          type: string
        source_id:
          type: string
        scope_key:
          type: string
        kind:
          type: string
          enum: [fact, preference, event, procedure]
        content:
          type: string
        content_mode:
          type: string
          enum: [extractive, normalized]
        origin_role:
          type: string
        status:
          type: string
          enum: [observed, pending, retracted, deleted]
        extraction_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ObservationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'

    RecallRequest:
      type: object
      properties:
        query:
          type: string
        scope_key:
          type: string
        query_mode:
          type: string
          enum: [overview, detail, history, conflict, guidance]
        layers:
          type: array
          items:
            type: string
            enum: [observations, memories, l1, l2, l3, l4]
        mode:
          type: string
          enum: [keyword, hybrid]
          default: keyword
        filters:
          $ref: '#/components/schemas/SearchFilters'
        derived_states:
          type: array
          items:
            type: string
            enum: [active, stale]
        top_k:
          type: integer
          minimum: 0
          maximum: 100
        max_context_tokens:
          type: integer
          minimum: 0
        explain:
          type: boolean
          default: false

    SearchFilters:
      type: object
      properties:
        kinds:
          type: array
          items:
            type: string
            enum: [fact, preference, event, procedure]
        states:
          type: array
          items:
            type: string
            enum: [active, archived, deleted]
        updated_after:
          type: string
          format: date-time
        updated_before:
          type: string
          format: date-time

    RecallResponse:
      type: object
      required: [observations, memories, l1, l2, l3, l4, relations, conflicts, warnings]
      properties:
        query_mode:
          type: string
        observations:
          type: array
          items:
            $ref: '#/components/schemas/RecallObservationItem'
        memories:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
        l1:
          type: array
          items:
            $ref: '#/components/schemas/RecallDerivedItem'
        l2:
          type: array
          items:
            $ref: '#/components/schemas/RecallDerivedItem'
        l3:
          type: array
          items:
            $ref: '#/components/schemas/RecallDerivedItem'
        l4:
          type: array
          items:
            $ref: '#/components/schemas/RecallDerivedItem'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictSummary'
        warnings:
          type: array
          items:
            type: string
        diagnostics:
          $ref: '#/components/schemas/SearchDiagnostics'

    SearchItem:
      type: object
      required: [memory, score, snippet, matched_terms, evidence_refs, conflict_refs]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
        score:
          type: number
        snippet:
          type: string
        matched_terms:
          type: array
          items:
            type: string
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
        explanation:
          $ref: '#/components/schemas/Explanation'
        conflict_refs:
          type: array
          items:
            $ref: '#/components/schemas/ConflictRef'

    RecallObservationItem:
      type: object
      required: [observation, score, snippet, matched_terms, evidence_refs]
      properties:
        observation:
          $ref: '#/components/schemas/Observation'
        score:
          type: number
        snippet:
          type: string
        matched_terms:
          type: array
          items:
            type: string
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
        explanation:
          $ref: '#/components/schemas/Explanation'

    RecallDerivedItem:
      type: object
      required: [artifact, revision, score, snippet, matched_terms, dependencies]
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactMeta'
        revision:
          $ref: '#/components/schemas/ArtifactRevision'
        score:
          type: number
        snippet:
          type: string
        matched_terms:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactDependency'
        explanation:
          $ref: '#/components/schemas/Explanation'

    ArtifactDependency:
      type: object
      required: [type, id, version, required]
      properties:
        type:
          type: string
          enum: [observation, memory, derived, experience]
        id:
          type: string
        version:
          type: integer
        required:
          type: boolean

    EvidenceRef:
      type: object
      required: [id, source_id]
      properties:
        id:
          type: string
        source_id:
          type: string

    KeywordExplanation:
      type: object
      required: [rank, bm25]
      properties:
        rank:
          type: integer
        bm25:
          type: number

    SemanticExplanation:
      type: object
      required: [rank, cosine]
      properties:
        rank:
          type: integer
        cosine:
          type: number

    Explanation:
      type: object
      required: [ranking]
      properties:
        ranking:
          type: string
        field_weights:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
        keyword:
          $ref: '#/components/schemas/KeywordExplanation'
        semantic:
          $ref: '#/components/schemas/SemanticExplanation'

    SearchDiagnostics:
      type: object
      required: [keyword_candidates, observation_candidates, memory_candidates,
        derived_candidates, semantic_candidates, semantic_excluded, term_candidates,
        kind_filter_excluded, state_filter_excluded, ranking_candidates,
        returned_items, context_budget_truncated]
      properties:
        keyword_candidates:
          type: integer
        observation_candidates:
          type: integer
        memory_candidates:
          type: integer
        derived_candidates:
          type: integer
        semantic_candidates:
          type: integer
        semantic_excluded:
          type: integer
        term_candidates:
          type: integer
        kind_filter_excluded:
          type: integer
        state_filter_excluded:
          type: integer
        ranking_candidates:
          type: integer
        returned_items:
          type: integer
        context_budget_truncated:
          type: integer
        semantic_degradation:
          type: string

    ArtifactMeta:
      type: object
      required: [id, layer, kind, target_key, current_version, state, updated_at]
      properties:
        id:
          type: string
        layer:
          type: string
          enum: [l1, l2, l3, l4]
        kind:
          type: string
          enum: [local_summary, topic_summary, scope_summary, profile, experience_case, skill, guidance]
        target_key:
          type: string
        scope_key:
          type: string
        topic:
          type: string
        current_version:
          type: integer
        state:
          type: string
          enum: [active, stale, disabled]
        reason_code:
          type: string
        updated_at:
          type: string
          format: date-time

    ArtifactRevision:
      type: object
      required: [artifact_id, version, title, content, content_hash, generator,
        protocol_version, truncated, created_at]
      properties:
        artifact_id:
          type: string
        version:
          type: integer
        title:
          type: string
        content:
          type: string
        payload:
          description: Structured payload; unknown shapes are read-only JSON
        content_hash:
          type: string
        generator:
          type: string
        protocol_version:
          type: string
        truncated:
          type: boolean
        created_at:
          type: string
          format: date-time

    ArtifactDetail:
      type: object
      required: [artifact, dependencies]
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactMeta'
        revision:
          $ref: '#/components/schemas/ArtifactRevision'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactDependency'

    ArtifactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMeta'
        next_cursor:
          type: string

    ArtifactTargetJob:
      type: object
      required: [status, attempts, consecutive_failures, age_seconds, stale_seconds]
      properties:
        status:
          type: string
          enum: [queued, running, waiting, succeeded, failed, cancelled]
        wait_reason:
          type: string
        last_error_code:
          type: string
        retry_reason:
          type: string
        attempts:
          type: integer
        consecutive_failures:
          type: integer
        age_seconds:
          type: integer
        stale_seconds:
          type: integer
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ArtifactTarget:
      type: object
      required: [kind, target_key, status, has_usable_version, updated_at]
      properties:
        kind:
          type: string
          enum: [local_summary, topic_summary, scope_summary, profile, experience_case, skill, guidance]
        target_key:
          type: string
        scope_key:
          type: string
        topic:
          type: string
        status:
          type: string
          enum: [queued, running, waiting, active, stale, disabled,
            no_eligible_input, model_unavailable, generation_failed, invalid_output]
        reason_code:
          type: string
        has_usable_version:
          type: boolean
        artifact:
          $ref: '#/components/schemas/ArtifactMeta'
        job:
          $ref: '#/components/schemas/ArtifactTargetJob'
        evaluated_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ArtifactTargetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactTarget'
        next_cursor:
          type: string

    ArtifactMemoryRef:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
        version:
          type: integer

    ArtifactRunRef:
      type: object
      required: [experience_id]
      properties:
        experience_id:
          type: string

    SkillContent:
      type: object
      required: [id, version, state, name, description, content, truncated, memory_refs, run_refs]
      properties:
        id:
          type: string
        version:
          type: integer
        state:
          type: string
          enum: [active, stale, disabled]
        name:
          type: string
        description:
          type: string
        content:
          type: string
        truncated:
          type: boolean
        memory_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMemoryRef'
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRunRef'

    ExperienceSubmit:
      type: object
      required: [goal]
      properties:
        run_id:
          type: string
        app_id:
          type: string
        external_id:
          type: string
        scope_key:
          type: string
        goal:
          type: string
        conditions:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        outcome:
          type: string
          enum: [success, failure, unknown, partial_success]
        skill_id:
          type: string
        skill_version:
          type: integer
          minimum: 0
        content:
          description: Optional original report JSON

    ExperienceReceipt:
      type: object
      required: [id, source_id, outcome, state, created_at, updated_at]
      properties:
        id:
          type: string
        source_id:
          type: string
        run_id:
          type: string
        outcome:
          type: string
          enum: [success, failure, unknown, partial_success]
        state:
          type: string
          enum: [recorded, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceSegment:
      type: object
      required: [segment_id, start, end, text]
      properties:
        segment_id:
          type: string
        message_id:
          type: string
        role:
          type: string
        occurred_at:
          type: string
        field:
          type: string
        start:
          type: integer
        end:
          type: integer
        text:
          type: string

    Source:
      type: object
      required: [id, redacted, created_at, segments]
      properties:
        id:
          type: string
        app_id:
          type: string
        external_id:
          type: string
        scope_key:
          type: string
        content:
          description: Original JSON unless the source has been redacted
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SourceSegment'
        redacted:
          type: boolean
        redacted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    RedactResponse:
      type: object
      required: [id, redacted, cancelled_jobs, retracted_observations, invalidated_derived_ids]
      properties:
        id:
          type: string
        redacted:
          type: boolean
        cancelled_jobs:
          type: integer
        retracted_observations:
          type: integer
        invalidated_derived_ids:
          type: array
          items:
            type: string

    ForgetRequest:
      type: object
      properties:
        memory_ids:
          type: array
          items:
            type: string
        source_ids:
          type: array
          items:
            type: string
        experience_ids:
          type: array
          items:
            type: string

    ForgetResponse:
      type: object
      required: [memory_ids, source_ids, experience_ids]
      properties:
        memory_ids:
          type: array
          items:
            type: string
        source_ids:
          type: array
          items:
            type: string
        experience_ids:
          type: array
          items:
            type: string

    ExtractionStats:
      type: object
      required: [items, observations, normalized_observations, pending_observations,
        invalid_items, duplicate_observations, chunks, chunk_failures]
      properties:
        items:
          type: integer
        observations:
          type: integer
        normalized_observations:
          type: integer
        pending_observations:
          type: integer
        invalid_items:
          type: integer
        duplicate_observations:
          type: integer
        chunks:
          type: integer
        chunk_failures:
          type: integer

    JobTimings:
      type: object
      required: [queue_age_ms, extraction_ms, normalization_ms, commit_ms, total_ms]
      properties:
        queue_age_ms:
          type: integer
        extraction_ms:
          type: integer
        normalization_ms:
          type: integer
        commit_ms:
          type: integer
        total_ms:
          type: integer

    ModelUsage:
      type: object
      required: [calls, input_tokens, output_tokens, total_tokens]
      properties:
        calls:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer

    ExtractionDiagnostic:
      type: object
      required: [code, stage, disposition]
      properties:
        field:
          type: string
        code:
          type: string
        stage:
          type: string
        disposition:
          type: string

    JobStage:
      type: string
      enum: [received, extracting, observations_saved, governance_pending,
        memory_materialized, aggregation_pending, completed, failed]

    Job:
      type: object
      description: |
        Extraction job. Its stage stops at observations_saved/completed; the
        governance and aggregation stages are separate tasks.
      required: [id, source_id, status, stage, attempts, protocol_failures,
        observation_ids, warnings, extraction_stats, timings, model_usage,
        diagnostics, queue_age_seconds, stale_seconds, created_at, updated_at]
      properties:
        id:
          type: string
        source_id:
          type: string
        status:
          type: string
          enum: [queued, running, waiting, succeeded, failed, cancelled]
        stage:
          $ref: '#/components/schemas/JobStage'
        diagnostic_stage:
          type: string
          description: Extraction-internal failure stage when one was recorded
        attempts:
          type: integer
        protocol_failures:
          type: integer
        wait_reason:
          type: string
          enum: [transient, configuration, protocol]
        reason_code:
          type: string
        next_attempt_at:
          type: string
          format: date-time
        error:
          type: string
        observation_ids:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        quality_outcome:
          type: string
          enum: [empty, complete, partial, unusable]
        extraction_stats:
          $ref: '#/components/schemas/ExtractionStats'
        timings:
          $ref: '#/components/schemas/JobTimings'
        model_usage:
          $ref: '#/components/schemas/ModelUsage'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionDiagnostic'
        queue_age_seconds:
          type: integer
        stale_seconds:
          type: integer
        retry_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'

    GovernanceJob:
      type: object
      description: Governance or aggregation task with its own category and stage
      required: [id, category, stage, kind, target_key, revision, status, attempts,
        consecutive_failures, created_at, updated_at]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [governance, aggregation]
        stage:
          $ref: '#/components/schemas/JobStage'
        kind:
          type: string
          enum: [govern_observation, classify_observation, aggregate_l1,
            aggregate_l2, aggregate_l3, build_guidance, review_conflict,
            invalidate_dependency, reconcile]
        target_key:
          type: string
        revision:
          type: integer
        status:
          type: string
          enum: [queued, running, waiting, succeeded, failed, cancelled]
        attempts:
          type: integer
        consecutive_failures:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_error_code:
          type: string
        wait_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    GovernanceJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceJob'

    ConflictReason:
      type: string
      enum: [contradictory_value, uncertain_time, ambiguous_scope, complex_timeline]

    ConflictRef:
      type: object
      required: [id, reason_code]
      properties:
        id:
          type: string
        reason_code:
          $ref: '#/components/schemas/ConflictReason'

    ConflictSummary:
      type: object
      required: [id, reason_code, member_ids, has_accepted]
      properties:
        id:
          type: string
        reason_code:
          $ref: '#/components/schemas/ConflictReason'
        member_ids:
          type: array
          items:
            type: string
        has_accepted:
          type: boolean

    ConflictMember:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
        version:
          type: integer
        current_version:
          type: integer

    MemberVersion:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
        version:
          type: integer

    ConflictEvent:
      type: object
      required: [id, action, created_at]
      properties:
        id:
          type: string
        action:
          type: string
        memory_id:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time

    Conflict:
      type: object
      required: [id, status, reason_code, revision, created_at, updated_at, members]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [open, resolved]
        reason_code:
          $ref: '#/components/schemas/ConflictReason'
        resolution:
          type: string
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/ConflictMember'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConflictEvent'

    ConflictList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'

    ConflictResolveRequest:
      type: object
      required: [revision, action]
      properties:
        revision:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [choose, reject_all]
        member_ids:
          type: array
          items:
            type: string
        member_versions:
          type: array
          items:
            $ref: '#/components/schemas/MemberVersion'
        reason:
          type: string

    EmbeddingStatus:
      type: object
      required: [enabled, min_similarity, index_version,
        config_fingerprint_match, rebuild_required, documents, current_vectors,
        stale_vectors, missing_vectors, pending_jobs, failed_jobs, failed_codes,
        indexed_profiles, coverage, ready, reason_code, checked_at]
      properties:
        enabled:
          type: boolean
        model:
          type: string
        endpoint:
          type: string
        dimensions:
          type: integer
        min_similarity:
          type: number
        profile_id:
          type: string
        index_version:
          type: string
        registered_profile_id:
          type: string
        registered_index_version:
          type: string
        config_fingerprint_match:
          type: boolean
        rebuild_required:
          type: boolean
        rebuild_reason:
          type: string
        rebuild_registered_at:
          type: string
          format: date-time
        documents:
          type: integer
        current_vectors:
          type: integer
        stale_vectors:
          type: integer
        missing_vectors:
          type: integer
        pending_jobs:
          type: integer
        failed_jobs:
          type: integer
        failed_codes:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code:
                type: string
              count:
                type: integer
        indexed_profiles:
          type: array
          items:
            type: object
            required: [profile_id, vectors]
            properties:
              profile_id:
                type: string
              vectors:
                type: integer
        coverage:
          type: number
        ready:
          type: boolean
        reason_code:
          type: string
          enum: [ready, disabled, no_documents, config_mismatch,
            index_not_ready, backlog, failed_jobs]
        checked_at:
          type: string
          format: date-time

    EmbeddingProbe:
      type: object
      required: [attempted, success, code, duration_ms, checked_at]
      properties:
        attempted:
          type: boolean
        success:
          type: boolean
        code:
          type: string
        dimensions:
          type: integer
        duration_ms:
          type: integer
        checked_at:
          type: string
          format: date-time
