openapi: 3.0.3
info:
  title: dmemd local memory service
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Local HTTP/1.1 JSON contract for dmemd. This document is descriptive only;
    it does not generate authentication or business validation. There is no
    authentication: Authorization headers are optional and ignored. Lists are
    returned in one response and have no pagination metadata.

    Every path below is implemented in internal/transport/http and assembled by
    internal/runtime. The HTTP contract and process lifecycle are exercised by
    the integration and end-to-end tests.

    First-release validation is documented in docs/quality.md: fixed labeled
    samples cover classification, summary constraints, deterministic conflict
    review and Skill boundaries; an opt-in 10k atomic-memory scenario covers
    governance backlog, concurrent recall and one-transaction permanent forget.
    Those results do not claim real-model semantic quality, 100k capacity, OS
    application isolation, execution certification or backup/restore.
servers:
  - url: http://127.0.0.1:18432
security: []
tags:
  - name: ingest
    description: Unified content submission and processing jobs
  - name: memories
    description: Current memories, lifecycle, history, evidence and recall
  - name: conflicts
    description: Open contradictions and explicit human adjudication
  - name: sources
    description: Original submission lookup and redaction
  - name: experiences
    description: Application-reported completion results and explicit retraction
  - name: skills
    description: Rendered guidance skills with traceable sources
  - name: embedding
    description: Explicit semantic-index configuration, coverage and degradation diagnostics
  - name: health
    description: Process liveness and database readiness

paths:
  /v1/ingestions:
    post:
      tags: [ingest]
      summary: Submit arbitrary JSON content for background extraction
      description: |
        Accepts strings, objects, arrays or null as content. Saves the source and
        a queued ingest job in one transaction, then returns 202 without waiting
        for a model. app_id and external_id are optional informational source
        fields. scope_key is an optional flat scope label supplied by the calling
        context; the model never invents or promotes it. Job progress is queried
        through GET /v1/ingest-jobs/{id}; classification runs later through the
        persistent governance worker.
      operationId: createIngestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            examples:
              text:
                summary: Simple text
                value:
                  content: 以后请默认使用中文回答。
              conversation:
                summary: Conversation object
                value:
                  app_id: desktop-assistant
                  external_id: conversation-42-batch-7
                  content:
                    messages:
                      - role: user
                        content: 以后请默认使用中文回答。
                        occurred_at: '2026-10-20T02:00:00Z'
              structured:
                summary: Existing structured content
                value:
                  content:
                    preferences:
                      answer_language: zh-CN
              array:
                summary: Array content
                value:
                  content:
                    - role: user
                      content: 以后请默认使用中文回答。
                    - role: assistant
                      content: 好的。
      responses:
        '202':
          description: Source and queued job persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
              example:
                source_id: 22222222-2222-4222-8222-222222222222
                job_id: 33333333-3333-4333-8333-333333333333
                status: queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories:
    get:
      tags: [memories]
      summary: List current memories
      description: |
        Default state set is active+archived; deleted tombstones are returned
        only when states explicitly contains deleted. Default limit is 50.
        All assertion statuses are listed unless filtered. Order is
        updated_at DESC, id ASC. There is no pagination.
      operationId: listMemories
      parameters:
        - name: kinds
          in: query
          description: Comma-separated fact,preference,event,procedure
          schema:
            type: string
          example: fact,preference
        - name: states
          in: query
          description: Comma-separated active,archived,deleted
          schema:
            type: string
          example: active,archived
        - name: assertion_status
          in: query
          description: Comma-separated accepted,pending,rejected
          schema:
            type: string
          example: pending
        - name: fact_group_id
          in: query
          description: Filter by fact group id
          schema:
            type: string
          example: 55555555-5555-4555-8555-555555555555
        - name: created_by_app
          in: query
          description: Filter by the app_id captured when the memory was created
          schema:
            type: string
          example: desktop-assistant
        - name: updated_after
          in: query
          description: Inclusive RFC 3339 lower bound; invalid values are ignored
          schema:
            type: string
            format: date-time
        - name: updated_before
          in: query
          description: Inclusive RFC 3339 upper bound; invalid values are ignored
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Positive result limit; missing or invalid values use 50
          schema:
            type: integer
          example: 50
      responses:
        '200':
          description: One filtered result set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryList'
              example:
                items:
                  - id: 11111111-1111-4111-8111-111111111111
                    kind: preference
                    title: 回答语言
                    content: 用户希望默认使用中文回答。
                    state: active
                    version: 3
                    observed_at: '2026-10-20T02:00:00Z'
                    created_at: '2026-10-20T02:00:01Z'
                    updated_at: '2026-10-20T03:00:00Z'
                    created_by_app: desktop-assistant
                    origin_source_id: 22222222-2222-4222-8222-222222222222
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/recall:
    post:
      tags: [memories]
      summary: Unified layered recall for atomic memories and derived artifacts
      description: |
        The single recall entry point. layers selects atomic, summary,
        experience and skill partitions; omitting layers selects all four.
        filters.kinds and filters.states only narrow the atomic partition and
        are never applied to derived layers. scope_key filters both atomic
        memories and derived artifacts to the requested scope or the user-global
        scope; omitted scope_key disables that filter. User text is ordinary
        keywords, never FTS syntax. Hybrid and keyword modes use the same
        internal retrieval semantics as atomic search. Explicit filters.as_of
        returns atomic history only: derived partitions stay empty and include
        derived_as_of_unsupported. A derived-index failure degrades to atomic
        results with derived_unavailable and never waits for generation.
        Experiences are application reports, not verified execution results;
        skills are guidance only and carry no execution or safety certification.
        After primary hits, atomic recall may append bounded same-fact and
        unresolved-conflict members with a related marker. Association obeys the
        same scope/kind/state/time filters and only uses remaining top_k room.
        Exact duplicate expressions of one fact are folded into a display
        cluster that preserves every member ID and the union of evidence.
        explain=true adds optional bounded stage counts under diagnostics.
      operationId: recallMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              layered:
                summary: Default all-layer recall for one project
                value:
                  query: 修改项目后应该如何验证
                  scope_key: project:dmemd
                  max_context_tokens: 3000
              atomic_only:
                summary: Explicit atomic-only recall
                value:
                  query: 项目使用什么数据库
                  scope_key: project:dmemd
                  layers: [atomic]
                  top_k: 20
              hybrid:
                summary: Hybrid atomic + summary recall
                value:
                  query: 吃饭有什么忌口
                  mode: hybrid
                  layers: [atomic, summary]
                  top_k: 10
              historical:
                summary: Atomic history at one instant; derived partitions stay empty
                value:
                  query: 用户住在哪里
                  layers: [atomic]
                  filters:
                    as_of: '2026-07-01T00:00:00Z'
                  top_k: 10
      responses:
        '200':
          description: One partitioned recall result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              example:
                memories:
                  - memory:
                      id: 11111111-1111-4111-8111-111111111111
                      kind: preference
                      title: 回答语言
                      content: 用户希望默认使用中文回答。
                      state: active
                      version: 3
                      observed_at: '2026-10-20T02:00:00Z'
                      created_at: '2026-10-20T02:00:01Z'
                      updated_at: '2026-10-20T03:00:00Z'
                      created_by_app: desktop-assistant
                      origin_source_id: 22222222-2222-4222-8222-222222222222
                    score: 0.03252247
                    snippet: 用户希望默认使用中文回答。
                    matched_terms: [回答, 语言]
                    evidence_refs:
                      - id: 44444444-4444-4444-8444-444444444444
                        source_id: 22222222-2222-4222-8222-222222222222
                    explanation:
                      ranking: rrf
                      keyword:
                        rank: 1
                        bm25: -0.0000042
                      semantic:
                        rank: 2
                        cosine: 0.93
                    temporal_status: unknown
                    conflict_refs: []
                summaries:
                  - id: 66666666-6666-4666-8666-666666666666
                    kind: topic_summary
                    version: 1
                    title: 回答偏好
                    content: 用户希望默认使用中文回答。
                    scope_key: user
                    topic: language
                    state: active
                    truncated: false
                    memory_refs:
                      - memory_id: 11111111-1111-4111-8111-111111111111
                        version: 3
                    updated_at: '2026-10-20T03:10:00Z'
                experiences: []
                skills: []
                conflicts: []
                warnings: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts:
    get:
      tags: [memories]
      summary: List current derived artifacts
      description: |
        Bounded keyset page of current derived objects. Filters do not change
        recall visibility; stale and disabled objects remain readable for
        management and audit.
      operationId: listArtifacts
      parameters:
        - name: scope_key
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [topic_summary, scope_summary, profile, experience_case, skill]
        - name: state
          in: query
          schema:
            type: string
            enum: [active, stale, disabled]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Current artifacts in stable target order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifact-targets:
    get:
      tags: [memories]
      summary: List derived generation targets and their state
      description: |
        Includes targets that have never produced an artifact. This separates
        "not eligible yet" from a disabled or failed content object, queued,
        running and waiting work, a usable current version and stale content.
      operationId: listArtifactTargets
      parameters:
        - name: scope_key
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [topic_summary, scope_summary, profile, experience_case, skill]
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, waiting, active, stale, disabled,
              no_eligible_input, model_unavailable, generation_failed, invalid_output]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Generation targets in stable target order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactTargetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{id}:
    get:
      tags: [memories]
      summary: Read one derived artifact and its current revision
      operationId: getArtifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artifact state and current revision when one exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{id}/history/{version}:
    get:
      tags: [memories]
      summary: Read one historical derived revision
      operationId: getArtifactHistoryEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Historical revision with owning artifact state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/experiences:
    post:
      tags: [experiences]
      summary: Submit one completed application-reported result
      description: |
        Stores the original report as a source and one experience_run, then
        queues experience-case generation. outcome is the application's report
        (success, failure or unknown) and is never upgraded to a verified
        execution result. A supplied run_id is an optional deduplication key:
        repeating it returns the existing receipt without comparing the request
        body, overwriting the stored result or restoring a revoked result.
      operationId: createExperience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceSubmit'
            example:
              run_id: run-2026-10-22-1
              scope_key: project:dmemd
              goal: 修改 dmemd 后验证
              conditions: [依赖已安装]
              actions: [运行 go test, 执行构建检查]
              outcome: success
              skill_id: 88888888-8888-4888-8888-888888888888
              skill_version: 2
      responses:
        '202':
          description: Saved result receipt; duplicate run_id returns the existing receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/experiences/{id}/retract:
    post:
      tags: [experiences]
      summary: Revoke one reported result and block dependent use
      description: |
        Marks the application report revoked, disables its experience case and
        synchronously removes affected skills from default recall while queuing
        regeneration from the remaining sources. The operation is idempotent.
      operationId: retractExperience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated receipt with state=revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/skills/{id}/content:
    get:
      tags: [skills]
      summary: Read one rendered SKILL.md guidance document
      description: |
        By default returns the active current version only; a stale or disabled
        current skill is not served as active advice. An explicit positive
        version reads that immutable revision and returns its owning state.
        The content is guidance only and carries no execution or safety
        certification. Permanently cleared objects are not readable.
      operationId: getSkillContent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Rendered SKILL.md plus exact version, state and sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: Get the current memory snapshot
      description: |
        Deleted memories remain readable as tombstones by ID. Relations carry
        decision-time versions and whether either endpoint has since changed.
      operationId: getMemory
      responses:
        '200':
          description: Current snapshot and relations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDetail'
              example:
                id: 11111111-1111-4111-8111-111111111111
                kind: preference
                title: 回答语言
                content: 用户希望默认使用中文回答。
                state: active
                version: 3
                observed_at: '2026-10-20T02:00:00Z'
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T03:00:00Z'
                created_by_app: desktop-assistant
                origin_source_id: 22222222-2222-4222-8222-222222222222
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [memories]
      summary: Logically delete a memory
      description: |
        Writes a deleted tombstone and a new revision. The record, history and
        dedicated evidence remain readable; use POST /purge for permanent
        removal.
      operationId: deleteMemory
      responses:
        '200':
          description: Logical delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                id: 11111111-1111-4111-8111-111111111111
                state: deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/state:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    patch:
      tags: [memories]
      summary: Change lifecycle state only
      description: |
        Accepts only active or archived. Unknown, missing or unchanged state is
        a no-op returning the current memory. Content fields are ignored; content
        corrections must be submitted through POST /v1/ingestions.
      operationId: setMemoryState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatePatch'
            example:
              state: archived
      responses:
        '200':
          description: Updated current memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
              example:
                id: 11111111-1111-4111-8111-111111111111
                kind: preference
                title: 回答语言
                content: 用户希望默认使用中文回答。
                state: archived
                version: 4
                observed_at: '2026-10-20T02:00:00Z'
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T04:00:00Z'
                created_by_app: desktop-assistant
                origin_source_id: 22222222-2222-4222-8222-222222222222
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/purge:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    post:
      tags: [memories]
      summary: Permanently purge a memory
      description: |
        Permanently removes the current record, history and dedicated evidence;
        shared sources remain. This operation has no request body.
      operationId: purgeMemory
      responses:
        '200':
          description: Purge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResponse'
              example:
                id: 11111111-1111-4111-8111-111111111111
                purged: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: List complete revision history
      description: Newest version first; default limit 50; no pagination.
      operationId: listMemoryHistory
      parameters:
        - name: limit
          in: query
          description: Positive result limit; missing or invalid values use 50
          schema:
            type: integer
          example: 50
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
              example:
                items:
                  - memory_id: 11111111-1111-4111-8111-111111111111
                    version: 3
                    operation: update
                    reason: 用户更正回答语言
                    snapshot:
                      id: 11111111-1111-4111-8111-111111111111
                      kind: preference
                      title: 回答语言
                      content: 用户希望默认使用中文回答。
                      state: active
                      version: 3
                      observed_at: '2026-10-20T02:00:00Z'
                      created_at: '2026-10-20T02:00:01Z'
                      updated_at: '2026-10-20T03:00:00Z'
                      created_by_app: desktop-assistant
                      origin_source_id: 22222222-2222-4222-8222-222222222222
                    evidence:
                      - id: 44444444-4444-4444-8444-444444444444
                        source_id: 22222222-2222-4222-8222-222222222222
                        message_id: msg-1
                        quote: 以后请默认使用中文回答。
                        location:
                          field: messages.0.content
                          start: 0
                          end: 12
                        model_name: example-model
                        redacted: false
                        created_at: '2026-10-20T02:00:01Z'
                    created_at: '2026-10-20T03:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history/{version}:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [memories]
      summary: Get one complete historical version
      operationId: getMemoryHistoryEntry
      responses:
        '200':
          description: Version snapshot and complete evidence set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [memories]
      summary: Restore a historical version as a new current version
      description: |
        Never overwrites history. Restored state is active; assertion status is
        not promoted, and a pending/rejected historical assertion keeps its
        status. If restoring an accepted assertion would create an unmarked
        conflict in the current fact group, the whole restore returns 409 and
        no version is written. A missing or unknown version returns 404.
      operationId: restoreMemoryVersion
      responses:
        '200':
          description: Restored current memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
              example:
                id: 11111111-1111-4111-8111-111111111111
                kind: preference
                title: 回答语言
                content: 用户希望默认使用中文回答。
                state: active
                version: 4
                observed_at: '2026-10-20T02:00:00Z'
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T05:00:00Z'
                created_by_app: desktop-assistant
                origin_source_id: 22222222-2222-4222-8222-222222222222
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictStale'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: Get the current or a historical version evidence set
      description: |
        version absent, 0 or invalid means current. A positive nonexistent
        version returns 404. Redacted evidence keeps its ID and source_id but
        never returns quote or location copies.
      operationId: getMemoryEvidence
      parameters:
        - name: version
          in: query
          description: Target version; absent/0/invalid means current version
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Complete evidence set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceList'
              example:
                items:
                  - id: 44444444-4444-4444-8444-444444444444
                    source_id: 22222222-2222-4222-8222-222222222222
                    message_id: msg-1
                    quote: 以后请默认使用中文回答。
                    location:
                      field: messages.0.content
                      start: 0
                      end: 12
                    model_name: example-model
                    redacted: false
                    created_at: '2026-10-20T02:00:01Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts:
    get:
      tags: [conflicts]
      summary: List conflicts
      description: Fixed updated_at DESC, id ASC ordering with one result set.
      operationId: listConflicts
      parameters:
        - name: status
          in: query
          description: open or resolved; default open
          schema:
            type: string
            enum: [open, resolved]
            default: open
        - name: limit
          in: query
          description: Positive result limit; missing or invalid values use 50
          schema:
            type: integer
      responses:
        '200':
          description: One filtered conflict set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [conflicts]
      summary: Get a conflict with members and audit events
      operationId: getConflict
      responses:
        '200':
          description: Conflict detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [conflicts]
      summary: Explicitly adjudicate one conflict
      description: |
        The client submits the conflict revision and the member versions it
        inspected. A stale conflict or member returns 409; malformed actions or
        timelines return 400. Resolving an already resolved conflict with the
        same payload returns the existing result; a different result returns 409.
      operationId: resolveConflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolveRequest'
      responses:
        '200':
          description: Resolved conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictStale'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/forget:
    post:
      tags: [memories]
      summary: Permanently forget atomic memories, sources or application reports
      description: |
        Removes every requested leaf and, before any foreign-key cascade runs,
        enumerates and removes dependent derived objects, their history, FTS
        rows and dependency edges. Forgetting a source expands to all
        associated memories and application reports; forgetting a report also
        removes its dedicated source. The whole request is one transaction: an
        unknown identifier or storage failure rolls back every listed target.
        Historical and rendered derived reads return 404 after commit.
        Source association includes evidence in any memory revision, not only
        the current origin. Duplicate closure requires the same non-empty fact
        group, scope, kind and phase, formatting-normalized identical content,
        and equal or overlapping valid time. Deleted copies are included.
        Same-group memories that fail these safeguards are retained and listed
        with related_memories_retained. Dependent conflicts (including resolved
        history) are removed and their review jobs cancelled; derived jobs are
        revision-invalidated and rebuilt from remaining inputs.
      operationId: forget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetRequest'
            example:
              source_ids: [22222222-2222-4222-8222-222222222222]
              experience_ids: [33333333-3333-4333-8333-333333333333]
      responses:
        '200':
          description: Identifiers removed by the committed transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgetResponse'
              example:
                memory_ids: [11111111-1111-4111-8111-111111111111]
                source_ids: [22222222-2222-4222-8222-222222222222]
                experience_ids: [33333333-3333-4333-8333-333333333333]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [sources]
      summary: Get a submission and its original content
      description: Redacted sources retain the ID and status but omit content.
      operationId: getSource
      responses:
        '200':
          description: Source record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
              examples:
                original:
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    app_id: desktop-assistant
                    external_id: conversation-42-batch-7
                    content:
                      messages:
                        - role: user
                          content: 以后请默认使用中文回答。
                    redacted: false
                    created_at: '2026-10-20T02:00:01Z'
                redacted:
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    redacted: true
                    redacted_at: '2026-10-20T06:00:00Z'
                    created_at: '2026-10-20T02:00:01Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [sources]
      summary: Redact original content and cancel unfinished jobs
      description: |
        Clears original content and every evidence quote/location copy in one
        transaction, keeps the source ID and redacted status, cancels queued or
        running jobs, scrubs terminal job error summaries that could retain
        original text, and leaves already formed memory text intact.
      operationId: redactSource
      responses:
        '200':
          description: Redaction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactResponse'
              example:
                id: 22222222-2222-4222-8222-222222222222
                redacted: true
                cancelled_jobs: 1
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/ingest-jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [ingest]
      summary: Get processing status and result summary
      operationId: getIngestJob
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                id: 33333333-3333-4333-8333-333333333333
                source_id: 22222222-2222-4222-8222-222222222222
                status: succeeded
                attempts: 1
                quality_outcome: complete
                extraction_stats:
                  raw_candidates: 1
                  parsed_candidates: 1
                  normalized_candidates: 0
                  normalizations: 0
                  repair_attempts: 0
                  repaired_candidates: 0
                  repair_succeeded: 0
                  repair_failed: 0
                  repair_timed_out: 0
                  repair_invalid_output: 0
                  excluded_candidates: 0
                  isolated_candidates: 0
                  accepted_candidates: 1
                  skipped_candidates: 0
                  memory_writes: 1
                  extraction_chunks: 1
                  extraction_chunk_failures: 0
                  dropped_candidates: 0
                  cross_chunk_duplicates: 0
                  context_only_candidates: 0
                retention:
                  retained: 1
                  not_retained: 0
                  by_reason: {explicit_intent: 1}
                  not_retained_by_reason: {}
                timings:
                  queue_age_ms: 1000
                  extraction_ms: 900
                  normalization_ms: 3
                  repair_ms: 0
                  context_ms: 20
                  decision_ms: 0
                  commit_ms: 15
                  total_ms: 938
                model_usage: {calls: 1, input_tokens: 120, output_tokens: 40, total_tokens: 160}
                efficiency: {memories: 1, model_calls: 1, total_tokens: 160, calls_per_memory: 1, tokens_per_memory: 160}
                queue_age_seconds: 1
                stale_seconds: 0
                diagnostics: []
                convergence: []
                memory_ids: [11111111-1111-4111-8111-111111111111]
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T02:00:03Z'
                started_at: '2026-10-20T02:00:02Z'
                finished_at: '2026-10-20T02:00:03Z'
        '404':
