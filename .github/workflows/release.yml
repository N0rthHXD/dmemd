name: release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9]'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify linux/amd64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.sum

      - name: Set up exact Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up exact npm version
        run: npm install --global "npm@$(node -p 'require("./web/package.json").engines.npm')"

      - name: Build and verify release archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        # Validate untrusted tag text in Bash before passing it to Make expansion.
        shell: bash
        run: |
          if [[ ! $RELEASE_VERSION =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo 'Release tag must use YY.MM.DD, for example 26.11.03' >&2
            exit 1
          fi
          make release VERSION="$RELEASE_VERSION"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmemd-${{ github.ref_name }}
          path: dist/${{ github.ref_name }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: dmemd-${{ github.ref_name }}
          path: dist

      - name: Publish release assets and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "dmemd $RELEASE_TAG"
