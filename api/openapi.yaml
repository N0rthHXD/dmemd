        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/embedding/status:
    get:
      tags: [embedding]
      summary: Read semantic configuration and vector coverage diagnostics
      description: |
        Reports the configured model, credential-free endpoint, dimensions and
        profile fingerprint alongside durable coverage counts. current_vectors
        only counts vectors matching the active profile, dimensions and current
        document content hash. stale_vectors and missing_vectors are excluded
        from recall and drive rebuild_required. A non-empty index with zero
        current vectors reports index_not_ready instead of implying semantic
        irrelevance. The response never contains an API key, source text, query
        text, vector values or a raw provider response.
      operationId: getEmbeddingStatus
      responses:
        '200':
          description: Embedding diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingStatus'
              example:
                enabled: true
                model: embedding-model
                endpoint: http://127.0.0.1:9999/v1
                dimensions: 1024
                min_similarity: 0.25
                profile_id: 6f2a2f8b1d9e4c3a8b7f6e5d4c3b2a19
                index_version: dmemd-embedding-v1
                registered_profile_id: 6f2a2f8b1d9e4c3a8b7f6e5d4c3b2a19
                registered_index_version: dmemd-embedding-v1
                config_fingerprint_match: true
                rebuild_required: false
                documents: 120
                current_vectors: 120
                stale_vectors: 0
                missing_vectors: 0
                pending_jobs: 0
                failed_jobs: 0
                failed_codes: []
                indexed_profiles:
                  - profile_id: 6f2a2f8b1d9e4c3a8b7f6e5d4c3b2a19
                    vectors: 120
                coverage: 1.0
                ready: true
                reason_code: ready
                checked_at: '2026-10-27T04:00:00Z'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/embedding/probe:
    post:
      tags: [embedding]
      summary: Explicitly check the embedding endpoint and response shape
      description: |
        Makes one bounded online-model call with a fixed header-free probe text.
        It distinguishes disabled configuration, authorization, rate limiting,
        timeout, network/server failure and an invalid vector response. The result
        is not persisted and never affects readiness or recall.
      operationId: probeEmbedding
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProbe'
              example:
                attempted: true
                success: true
                code: ok
                dimensions: 1024
                duration_ms: 42
                checked_at: '2026-10-27T04:00:00Z'
        '503':
          $ref: '#/components/responses/Unavailable'

  /healthz:
    get:
      tags: [health]
      summary: Process liveness
      operationId: healthz
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok

  /readyz:
    get:
      tags: [health]
      summary: Database readiness
      description: A model outage does not affect readiness.
      operationId: readyz
      responses:
        '200':
          description: Database ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ready
        '503':
          description: Database not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: unavailable

components:
  parameters:
    MemoryID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
      example: 2

  responses:
    BadRequest:
      description: Request body is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 请求体不是有效的 JSON。
    NotFound:
      description: Requested resource or version does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 资源不存在。
    InternalError:
      description: Internal execution failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 内部执行失败。
    ConflictStale:
      description: The conflict, member versions or current accepted facts changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 冲突或版本已变化，请重新读取。
            code: conflict_stale
    Unavailable:
      description: Service or database is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 服务暂不可用。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: 请求体不是有效的 JSON。
        code:
          type: string
          description: Stable code for conflict-specific failures
          example: conflict_stale

    SubmitRequest:
      type: object
      description: |
        All fields are optional. content may be any JSON value, including a
        string, object, array, number, boolean or null.
      properties:
        app_id:
          type: string
          description: Optional informational source name; no identity or uniqueness
          example: desktop-assistant
        external_id:
          type: string
          description: Optional external reference; no uniqueness constraint
          example: conversation-42-batch-7
        scope_key:
          type: string
          description: |
            Optional flat scope label such as user or project:dmemd. Empty means
            unknown; it is never silently promoted to a global scope.
          example: project:dmemd
        content:
          description: Arbitrary JSON content, including null
      additionalProperties: true

    SubmitResponse:
      type: object
      required: [source_id, job_id, status]
      properties:
        source_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]

    Memory:
      type: object
      required: [id, kind, phase, durability, title, content, state, assertion_status, version, observed_at,
        observed_at_basis, event_time_basis, event_time_precision, valid_from_basis, valid_to_basis,
        temporal, topics, raw_topics, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [fact, preference, event, procedure]
        phase:
          type: string
          description: Lifecycle phase of the assertion; independent from memory state
          enum: [unknown, scheduled, in_progress, completed, cancelled, postponed]
        durability:
          type: string
          description: Extraction durability metadata; not a truth or lifecycle decision
          enum: [unknown, durable, episodic, temporary]
        title:
          type: string
        content:
          type: string
        state:
          type: string
          enum: [active, archived, deleted]
        assertion_status:
          type: string
          description: accepted is system-adopted, pending needs adjudication, rejected is audited but not recalled
          enum: [accepted, pending, rejected]
        version:
          type: integer
          minimum: 1
        observed_at:
          type: string
          format: date-time
          description: >-
            When the source made or observed the statement. A missing value is
            filled from source receipt time and marked basis=recorded; that
            fallback is never evidence that the assertion itself happened later.
        observed_at_basis:
          type: string
          enum: [explicit, inferred, unknown, recorded]
        event_time:
          type: string
          format: date-time
          nullable: true
          description: >-
            When a scheduled or occurred event happens. Kept separate from fact
            validity so a future plan remains visible to a current plan query.
        event_time_basis:
          type: string
          enum: [explicit, inferred, unknown]
        event_time_precision:
          type: string
          enum: [unknown, year, month, day, hour, minute, second]
        valid_from:
          type: string
          format: date-time
          nullable: true
          description: Half-open interval start; absent means unknown, not "always valid"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Half-open interval end; absent means unknown
        valid_from_basis:
          type: string
          enum: [explicit, inferred, unknown]
        valid_to_basis:
          type: string
          enum: [explicit, inferred, unknown]
        temporal:
          $ref: '#/components/schemas/TemporalDetails'
        procedure:
          $ref: '#/components/schemas/Procedure'
        qualifiers:
          $ref: '#/components/schemas/AssertionQualifiers'
        fact_group_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_app:
          type: string
          description: app_id captured at creation; preserved by updates and restores
        origin_source_id:
          type: string
          format: uuid
        scope_key:
          type: string
          description: Flat scope label; absent or empty means unknown
        topics:
          type: array
          description: Canonical topic labels including inherited parents; bilingual aliases use taxonomy-v1, unknown labels remain extension leaves
          items:
            type: string
          example: [containers, kubernetes, oom]
        raw_topics:
          type: array
          description: Original labels before alias and parent expansion, preserved for audit
          items:
            type: string
          example: [K8s, 节点内存耗尽]
        retention_reason:
          type: string
          description: >-
            Service-derived retention reason. Informational only; it never
            deletes the memory or changes assertion status. Temporary context
            remains stored and visible for review.
          enum: [explicit_intent, future_applicability, durable_knowledge,
            episodic_event, temporary_context, unclassified]

    TemporalDetail:
      type: object
      properties:
        text:
          type: string
          description: Source date wording preserved for fidelity
        precision:
          type: string
          enum: [unknown, year, month, day, hour, minute, second]
        timezone_known:
          type: boolean
          description: False when the source stated a calendar date without a timezone

    TemporalDetails:
      type: object
      required: [observed, event, valid_from, valid_to]
      properties:
        observed:
          $ref: '#/components/schemas/TemporalDetail'
        event:
          $ref: '#/components/schemas/TemporalDetail'
        valid_from:
          $ref: '#/components/schemas/TemporalDetail'
        valid_to:
          $ref: '#/components/schemas/TemporalDetail'

    Procedure:
      type: object
      description: Optional structured reusable workflow stored in the immutable revision
      properties:
        goal:
          type: string
        steps:
          type: array
          items:
            type: string
        preconditions:
          type: array
          items:
            type: string
        completion_conditions:
          type: array
          items:
            type: string
        failure_branches:
          type: array
          items:
            type: string

    AssertionQualifiers:
      type: object
      description: General qualifiers retained with an assertion; the content remains authoritative
      properties:
        entities:
          type: array
          items:
            type: string
        quantity:
          type: object
          required: [value]
          properties:
            value:
              type: string
            unit:
              type: string
        conditions:
          type: array
          items:
            type: string
        polarity:
          type: string
          enum: [unknown, positive, negative, mixed]
        certainty:
          type: string
          enum: [unknown, asserted, uncertain, reported, hypothetical]
        attribution:
          type: string

    Relation:
      type: object
      required: [id, from_memory_id, from_version, to_memory_id, to_version, kind,
        created_at, from_version_changed, to_version_changed]
      properties:
        id:
          type: string
          format: uuid
        from_memory_id:
          type: string
          format: uuid
        from_version:
          type: integer
        to_memory_id:
          type: string
          format: uuid
        to_version:
          type: integer
        kind:
          type: string
          enum: [supersedes]
        created_at:
          type: string
          format: date-time
        from_version_changed:
          type: boolean
        to_version_changed:
          type: boolean

    MemoryDetail:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          required: [relations, evolution]
          properties:
            relations:
              type: array
              items:
                $ref: '#/components/schemas/Relation'
            evolution:
              type: array
              description: Deterministic supersession/correction audit touching this memory.
              items:
                $ref: '#/components/schemas/EvolutionEvent'

    MemoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'

    StatePatch:
      type: object
      description: Only active and archived are accepted; other fields are ignored.
      properties:
        state:
          type: string
          enum: [active, archived]

    DeleteResponse:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [deleted]

    PurgeResponse:
      type: object
      required: [id, purged]
      properties:
        id:
          type: string
          format: uuid
        purged:
          type: boolean
          enum: [true]

    Revision:
      type: object
      required: [memory_id, version, operation, snapshot, evidence, created_at]
      properties:
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        operation:
          type: string
          enum: [create, update, add_evidence, archive, activate, delete, restore,
            correct, change, resolve, classify]
        reason:
          type: string
        snapshot:
          $ref: '#/components/schemas/Memory'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        created_at:
          type: string
          format: date-time

    RevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'

    Evidence:
      type: object
      required: [id, source_id, redacted, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        message_id:
          type: string
        quote:
          type: string
          description: Absent after source redaction
        location:
          $ref: '#/components/schemas/Location'
        model_name:
          type: string
        redacted:
          type: boolean
        redacted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Location:
      type: object
      properties:
        field:
          type: string
          example: messages.0.content
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0

    EvidenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'

    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: >-
            Keywords or a natural-language question. All keyword paths, including
            derived layers and the hybrid keyword branch, use the same dictionary
            segmentation and controlled stopword filtering, preserving negation.
            Any remaining term may match. Empty, punctuation-only, or stopword-only
            input returns empty partitions without running retrieval. Keyword mode
            ranks by BM25 and bounded term coverage without a minimum-coverage
            filter. Semantic retrieval uses the original query without the document
            template.
        scope_key:
          type: string
          description: >-
            Optional flat scope. When supplied, atomic and derived results must
            belong to this scope or the user-global scope. Omitted means no
            scope filter. Unknown scope values are never promoted to global.
        layers:
          type: array
          description: >-
            Knowledge layers to recall. Omitted selects all four; an explicit
            list selects only those partitions. values other than the four
            fixed names return 400.
          items:
            type: string
            enum: [atomic, summary, experience, skill]
        mode:
          type: string
          enum: [keyword, hybrid]
          default: keyword
          description: >-
            Keyword uses FTS5/BM25 only. Hybrid runs both atomic recall paths and
            fuses them with RRF; semantic failures degrade to keyword with a
            warning. Derived layers always use their own FTS index.
        filters:
          $ref: '#/components/schemas/SearchFilters'
        top_k:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Default 20 for missing or non-positive values; above 100 is 400.
            The bound applies per selected layer.
        max_context_tokens:
          type: integer
          minimum: 0
          description: >-
            Optional conservative budget using a rune-based estimate, never a
            model-tokenizer-exact count. Exceeding it truncates later items and
            emits context_budget_truncated.
        explain:
          type: boolean
          default: false
          description: >-
            Adds per-item explanation and bounded response diagnostics. Stage
            counts never change the returned result set and contain no content.

    SearchFilters:
      type: object
      properties:
        kinds:
          type: array
          description: Recognized values are fact, preference, event, procedure
          items:
            type: string
        states:
          type: array
          description: Default is [active]; archived is opt-in; deleted is never returned
          items:
            type: string
        as_of:
          type: string
          format: date-time
          description: >-
            Fact validity instant, not the system knowledge-time snapshot.
            Missing pins request start once; an explicit malformed value returns
            400. Independent from updated_after/before. A result whose validity
            bounds are unknown remains visible with temporal_status=unknown and
            a temporal_uncertain warning on an explicit historical query.
        event_at:
          type: string
          format: date-time
          description: >-
            Event occurrence instant. Matches only events whose stored event_time
            and precision cover this instant; events with unknown event time are
            excluded. When provided without as_of, fact validity is not pinned
            to the current time, so past and scheduled occurrences stay
            queryable by their own event time.
        created_by_app:
          type: string
        updated_after:
          type: string
          format: date-time
        updated_before:
          type: string
          format: date-time

    SearchResponse:
      type: object
      required: [memories, summaries, experiences, skills, conflicts, warnings]
      properties:
        memories:
          type: array
          description: >-
            Atomic fact, preference, event and procedure results. Among primary
            hits, accepted assertions precede labelled pending alternatives;
            rejected assertions are never recalled. Bounded related items follow
            the primary hits and keep their own assertion status and related
            marker. Pending items emit fact_conflict.
          items:
            $ref: '#/components/schemas/SearchItem'
        summaries:
          type: array
          description: Active topic_summary, scope_summary and profile artifacts.
          items:
            $ref: '#/components/schemas/ArtifactItem'
        experiences:
          type: array
          description: >-
            Active experience_case artifacts generated from application-reported
            results. Outcomes are reports, not verified execution results.
          items:
            $ref: '#/components/schemas/ArtifactItem'
        skills:
          type: array
          description: >-
            Active guidance-only skills with traceable sources. They carry no
            execution, truth or safety certification.
          items:
            $ref: '#/components/schemas/ArtifactItem'
        conflicts:
          type: array
          description: >-
            Open conflicts touching this atomic query and as_of instant. Pending
            member text may appear in memories with assertion_status=pending and conflict_refs.
          items:
            $ref: '#/components/schemas/ConflictSummary'
        warnings:
          type: array
          description: Stable deduplicated warning codes.
          items:
            type: string
            enum: [semantic_unavailable, semantic_timeout,
              semantic_config_error, semantic_rate_limited,
              semantic_invalid_response, semantic_index_not_ready,
              fact_conflict, conflict_results_truncated,
              derived_as_of_unsupported, derived_unavailable,
              context_budget_truncated, temporal_uncertain]
        diagnostics:
          $ref: '#/components/schemas/SearchDiagnostics'

    ArtifactMemoryRef:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
        version:
          type: integer
          minimum: 1

    ArtifactRunRef:
      type: object
      required: [experience_id]
      properties:
        experience_id:
          type: string
          description: Service-internal recorded application result identifier

    ExperienceSubmit:
      type: object
      required: [goal]
      properties:
        run_id:
          type: string
          description: Optional client deduplication key; repeat returns the existing receipt
        app_id:
          type: string
        external_id:
          type: string
        scope_key:
          type: string
        goal:
          type: string
        conditions:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        outcome:
          type: string
          enum: [success, failure, unknown, partial_success]
          description: Application's own report; missing means unknown
        skill_id:
          type: string
          description: Optional exact skill object the run reports against
        skill_version:
          type: integer
          minimum: 0
        content:
          type: object
          additionalProperties: true
          description: Optional original report JSON stored as the source payload

    ExperienceReceipt:
      type: object
      required: [id, source_id, outcome, state, created_at, updated_at]
      properties:
        id:
          type: string
        source_id:
          type: string
        run_id:
          type: string
        outcome:
          type: string
          enum: [success, failure, unknown, partial_success]
        state:
          type: string
          enum: [recorded, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SkillContent:
      type: object
      required: [id, version, state, name, description, content, truncated,
        memory_refs, run_refs]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [active, stale, disabled]
        name:
          type: string
        description:
          type: string
        content:
          type: string
          description: Rendered SKILL.md with name/description frontmatter
        truncated:
          type: boolean
        memory_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMemoryRef'
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRunRef'

    ArtifactItem:
      type: object
      required: [id, kind, version, title, content, state, truncated,
        memory_refs, run_refs, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [topic_summary, scope_summary, profile, experience_case, skill]
        version:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          type: string
        payload:
          type: object
          description: Structured experience/skill payload when the kind has one
        scope_key:
          type: string
        topic:
          type: string
        state:
          type: string
          enum: [active, stale, disabled]
        truncated:
          type: boolean
          description: True when this version covers only a bounded subset of eligible input
        memory_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMemoryRef'
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRunRef'
        updated_at:
          type: string
          format: date-time
        score:
          type: number
          description: Derived FTS ranking score; larger is more relevant within this partition

    ArtifactMeta:
      type: object
      required: [id, kind, target_key, current_version, state, updated_at]
      properties:
        reason_code:
          type: string
          description: Current diagnostic such as no_procedure_input, topic_mismatch, model_generation_failed, invalid_model_output, invalid_profile_content, model_unavailable or no_eligible_input; readable even before a first revision exists
        id:
          type: string
        kind:
          type: string
          enum: [topic_summary, scope_summary, profile, experience_case, skill]
        target_key:
          type: string
        scope_key:
          type: string
        topic:
          type: string
        current_version:
          type: integer
          minimum: 0
          description: Zero only when no usable version has been generated
        state:
          type: string
          enum: [active, stale, disabled]
        updated_at:
          type: string
          format: date-time

    ArtifactRevision:
      type: object
      required: [artifact_id, version, title, content, content_hash, generator,
        protocol_version, taxonomy_version, generator_version, run_id, provenance,
        truncated, memory_refs, run_refs, created_at]
      properties:
        artifact_id:
          type: string
        version:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          type: string
        payload:
          type: object
          description: >-
            Structured payload. Summaries record input_selection
            (eligible/selected/included/omitted counts and reasons),
            citation_integrity, semantic_coverage (unknown/subset), validated
            citations and omitted_inputs; semantic coverage is unknown when the
            service cannot determine it and subset when omission is known. Profiles additionally
            record profile_check. Experience cases include the
            application-reported outcome and verification disclaimer.
        content_hash:
          type: string
          description: SHA-256 of title, body, serialized payload and immutable provenance, separated by NUL bytes
        generator:
          type: string
        protocol_version:
          type: string
        taxonomy_version:
          type: string
          example: taxonomy-v1
        generator_version:
          type: string
          example: generator-v2
        run_id:
          type: string
          description: Generation job ID and revision (not the client experience deduplication key)
        provenance:
          type: object
          description: Immutable serialized audit manifest, checked independently against the dependency tables
          required: [memory_refs, run_refs, run_id, taxonomy_version, generator_version, protocol_version, truncated]
          properties:
            memory_refs:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactMemoryRef'
            run_refs:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactRunRef'
            run_id:
              type: string
            taxonomy_version:
              type: string
            generator_version:
              type: string
            protocol_version:
              type: string
            truncated:
              type: boolean
        reason_code:
          type: string
          description: Fixed code such as input_truncated
        truncated:
          type: boolean
        memory_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMemoryRef'
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRunRef'
        created_at:
          type: string
          format: date-time

    ArtifactDetail:
      type: object
      required: [artifact]
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactMeta'
        revision:
          $ref: '#/components/schemas/ArtifactRevision'

    ArtifactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMeta'
        next_cursor:
          type: string

    ArtifactTargetJob:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [queued, running, waiting, succeeded, failed, cancelled]
        wait_reason:
          type: string
        last_error_code:
          type: string
        retry_reason:
          type: string
          description: Fixed wait or error reason, safe for monitoring
        attempts:
          type: integer
          minimum: 0
        consecutive_failures:
          type: integer
          minimum: 0
        age_seconds:
          type: integer
          minimum: 0
          description: Age of the durable target, including time deferred by ingest priority
        stale_seconds:
          type: integer
          minimum: 0
          description: Time since the queued, running or waiting task last changed state
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ArtifactTarget:
      type: object
      required: [kind, target_key, status, has_usable_version, updated_at]
      properties:
        kind:
          type: string
          enum: [topic_summary, scope_summary, profile, experience_case, skill]
        target_key:
          type: string
        scope_key:
          type: string
        topic:
          type: string
        status:
          type: string
          enum: [queued, running, waiting, active, stale, disabled,
            no_eligible_input, model_unavailable, generation_failed, invalid_output]
        reason_code:
          type: string
          description: Fixed reason such as no_procedure_input, topic_mismatch, model_generation_failed or invalid_model_output
        has_usable_version:
          type: boolean
          description: True when the artifact has at least one immutable revision, even if it is currently stale or disabled
        artifact:
          $ref: '#/components/schemas/ArtifactMeta'
        job:
          $ref: '#/components/schemas/ArtifactTargetJob'
        evaluated_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ArtifactTargetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactTarget'
        next_cursor:
          type: string

    SearchItem:
      type: object
      required: [memory, score, snippet, matched_terms, evidence_refs,
        temporal_status, conflict_refs]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
        score:
          type: number
          description: >-
            Keyword mode uses a bounded BM25-rank and term-coverage fusion.
            Hybrid mode uses the RRF score. Accepted assertions precede pending
            primary assertions regardless of score; scores compare relevance
            within the same assertion status in this result set. Bounded related
            items use score 0 because they were expanded by an explicit
            association rather than matched by the query.
        snippet:
          type: string
          description: >-
            Readable original content, never tokenized index text or HTML;
            long content is truncated around the first match with an ellipsis.
        matched_terms:
          type: array
          description: >-
            Keyword query groups actually found in the title or content.
            Terms use the shared filtered any query. Semantic-only results always
            return an empty array.
          items:
            type: string
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
        explanation:
          $ref: '#/components/schemas/Explanation'
        temporal_status:
          type: string
          enum: [within_bounds, unknown]
          description: Describes known interval bounds, not objective truth
        conflict_refs:
          type: array
          items:
            $ref: '#/components/schemas/ConflictRef'
        related:
          type: object
          description: >-
            Present only on bounded association expansion. Related items follow
            primary hits, obey exactly the same scope, kind, state, assertion and
            time filters, and never displace a primary Top-K hit.
          required: [reason_codes, anchor_memory_ids]
          properties:
            reason_codes:
              type: array
              items:
                type: string
                enum: [fact_group_member, conflict_member]
            anchor_memory_ids:
              type: array
              items:
                type: string
                format: uuid
        cluster:
          type: object
          description: >-
            Present when exact duplicate expressions of the same fact were folded
            into this display item. member_ids lists every folded memory and
            evidence_refs contains the union of their evidence. Different
            negation, conditions, time ranges, kinds, states or assertion status
            are never folded.
          required: [member_ids, evidence_count]
          properties:
            fact_group_id:
              type: string
              format: uuid
            member_ids:
              type: array
              items:
                type: string
                format: uuid
            evidence_count:
              type: integer
              minimum: 0

    SearchDiagnostics:
      type: object
      description: >-
        Stable, bounded stage counts returned only when explain=true. Counts are
        candidate counts and never proof of semantic correctness. Filter-exclusion
        counts come from count-only relaxations that retain scope and other
        boundaries and never change the returned result set.
      required: [keyword_candidates, semantic_candidates, semantic_excluded,
        term_candidates, kind_filter_excluded, state_filter_excluded,
        time_filter_excluded, ranking_candidates, related_expanded,
        related_excluded, returned_items, context_budget_truncated]
      properties:
        keyword_candidates:
          type: integer
          minimum: 0
        semantic_candidates:
          type: integer
          minimum: 0
        semantic_excluded:
          type: integer
          minimum: 0
        term_candidates:
          type: integer
          minimum: 0
        kind_filter_excluded:
          type: integer
          minimum: 0
          description: >-
            Additional same-scope term hits excluded by the requested kind filter.
            It does not assert that memory classification is wrong.
        state_filter_excluded:
          type: integer
          minimum: 0
        time_filter_excluded:
          type: integer
          minimum: 0
        ranking_candidates:
          type: integer
          minimum: 0
        related_expanded:
          type: integer
          minimum: 0
        related_excluded:
          type: integer
          minimum: 0
        returned_items:
          type: integer
          minimum: 0
        context_budget_truncated:
          type: integer
          minimum: 0
        semantic_degradation:
          type: string
          description: Stable warning code when the semantic branch degraded.

    EmbeddingStatus:
      type: object
      required: [enabled, min_similarity, index_version,
        config_fingerprint_match, rebuild_required, documents, current_vectors,
        stale_vectors, missing_vectors, pending_jobs, failed_jobs, failed_codes,
        indexed_profiles, coverage, ready, reason_code, checked_at]
      properties:
        enabled:
          type: boolean
        model:
          type: string
        endpoint:
          type: string
          description: Credential-free endpoint identity
        dimensions:
          type: integer
          minimum: 0
        min_similarity:
          type: number
        profile_id:
          type: string
        index_version:
          type: string
        registered_profile_id:
          type: string
        registered_index_version:
          type: string
        config_fingerprint_match:
          type: boolean
        rebuild_required:
          type: boolean
        rebuild_reason:
          type: string
          description: >-
            Fixed reason such as profile_changed, profile_registered,
            index_version_changed, vectors_stale, vectors_missing or jobs_pending.
        rebuild_registered_at:
          type: string
          format: date-time
        documents:
          type: integer
          minimum: 0
        current_vectors:
          type: integer
          minimum: 0
        stale_vectors:
          type: integer
          minimum: 0
        missing_vectors:
          type: integer
          minimum: 0
        pending_jobs:
          type: integer
          minimum: 0
        failed_jobs:
          type: integer
          minimum: 0
        failed_codes:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code:
                type: string
              count:
                type: integer
                minimum: 0
        indexed_profiles:
          type: array
          items:
            type: object
            required: [profile_id, vectors]
            properties:
              profile_id:
                type: string
              vectors:
                type: integer
                minimum: 0
        coverage:
          type: number
          minimum: 0
          maximum: 1
        ready:
          type: boolean
        reason_code:
          type: string
          enum: [ready, disabled, no_documents, config_mismatch,
            index_not_ready, backlog, failed_jobs]
        checked_at:
          type: string
          format: date-time

    EmbeddingProbe:
      type: object
      required: [attempted, success, code, duration_ms, checked_at]
      properties:
        attempted:
          type: boolean
        success:
          type: boolean
        code:
          type: string
          description: >-
            ok, disabled, unauthorized, config_error, rate_limited, timeout,
            cancelled, invalid_response, unavailable or a sanitized provider code
        dimensions:
          type: integer
        duration_ms:
          type: integer
          minimum: 0
        checked_at:
          type: string
          format: date-time

    EvidenceRef:
      type: object
      required: [id, source_id]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid

    Explanation:
      type: object
      required: [ranking]
      properties:
        ranking:
          type: string
          enum: [bm25, rrf]
        field_weights:
          type: array
          description: Present only for keyword-mode BM25 ranking
          minItems: 2
          maxItems: 2
          items:
            type: integer
          example: [4, 1]
        keyword:
          type: object
          description: Present when the keyword path recalled this item
          required: [rank, bm25]
          properties:
            rank:
              type: integer
              minimum: 1
            bm25:
              type: number
        semantic:
          type: object
          description: Present when the semantic path recalled this item
          required: [rank, cosine]
          properties:
            rank:
              type: integer
              minimum: 1
            cosine:
              type: number

    Source:
      type: object
      required: [id, redacted, created_at]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
        external_id:
          type: string
        scope_key:
          type: string
          description: Optional flat source scope label
        content:
          description: Original JSON; omitted after redaction
        redacted:
          type: boolean
        redacted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    RedactResponse:
      type: object
      required: [id, redacted, cancelled_jobs]
      properties:
        id:
          type: string
          format: uuid
        redacted:
          type: boolean
          enum: [true]
        cancelled_jobs:
          type: integer
          minimum: 0

    ForgetRequest:
      type: object
      description: At least one identifier is required.
      properties:
        memory_ids:
          type: array
          items:
            type: string
            format: uuid
        source_ids:
          type: array
          items:
            type: string
            format: uuid
        experience_ids:
          type: array
          items:
            type: string
            format: uuid

    ForgetResponse:
      type: object
      required: [memory_ids, source_ids, experience_ids]
      description: Sorted identifiers removed by the committed transaction.
      properties:
        memory_ids:
          type: array
          items:
            type: string
            format: uuid
        source_ids:
          type: array
          items:
            type: string
            format: uuid
        experience_ids:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          description: Present when related memories could not be safely deleted.
          items:
            type: string
            enum: [related_memories_retained]
        retained_related_memory_ids:
          type: array
          description: Sorted retained same-group IDs; omitted when none remain.
          items:
            type: string
            format: uuid

    Job:
      type: object
      required: [id, source_id, status, attempts, protocol_failures, memory_ids, conflict_ids,
        pending_memory_ids, warnings, extraction_stats, retention, timings, model_usage,
        efficiency, diagnostics, convergence, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            waiting means the task is parked. transient waits resume
            automatically with bounded backoff; configuration waits are
            reevaluated after a restart; protocol waits fail after worker.max_attempts
            consecutive malformed responses (default three), after local repair.
          enum: [queued, running, waiting, succeeded, failed, cancelled]
        attempts:
          type: integer
          minimum: 0
        protocol_failures:
          type: integer
          minimum: 0
          description: Consecutive protocol failures for the current input
        wait_reason:
          type: string
          enum: [transient, configuration, protocol]
          description: Fixed wait reason; never contains source or provider text
        stage:
          type: string
          enum: [source, extraction, extraction_repair, context, decision, decision_repair, commit, processing]
          description: Stage that caused the wait or failure
        reason_code:
          type: string
          enum: [configuration, transient, protocol, model_timeout, process_budget_exceeded,
            state_changed, decision_protocol_invalid, decision_repair_failed]
          description: Stable diagnostic code; independent of the display error
        next_attempt_at:
          type: string
          format: date-time
        error:
          type: string
          description: Sanitized failure summary; never a raw model response
        memory_ids:
          type: array
          description: All memories created or revised by this job
          items:
            type: string
            format: uuid
        conflict_ids:
          type: array
          items:
            type: string
            format: uuid
        pending_memory_ids:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          description: Stable warning codes such as fact_conflict or context_truncated
          items:
            type: string
        quality_outcome:
          type: string
          description: |
            Business result for the latest attempt, separate from scheduling
            status. empty means the model selected no candidates; complete means
            every non-excluded candidate was safely handled; partial means some
            candidates were isolated; unusable means non-empty candidates could
            not be made safe and the job is retrying or failed.
          enum: [empty, complete, partial, unusable]
        extraction_stats:
          type: object
          description: |
            Fixed stage counts for the latest attempt. Counts distinguish raw
            model candidates, repaired/split candidates and final dispositions.
          required: [raw_candidates, parsed_candidates, normalized_candidates, normalizations,
            repair_attempts, repaired_candidates, repair_succeeded, repair_failed,
            repair_timed_out, repair_invalid_output, excluded_candidates,
            isolated_candidates, accepted_candidates, skipped_candidates, memory_writes,
            extraction_chunks, extraction_chunk_failures, dropped_candidates,
            cross_chunk_duplicates, context_only_candidates]
          properties:
            raw_candidates: {type: integer, minimum: 0}
            parsed_candidates: {type: integer, minimum: 0}
            normalized_candidates: {type: integer, minimum: 0}
            normalizations: {type: integer, minimum: 0}
            repair_attempts: {type: integer, minimum: 0}
            repaired_candidates: {type: integer, minimum: 0}
            repair_succeeded: {type: integer, minimum: 0}
            repair_failed: {type: integer, minimum: 0}
            repair_timed_out: {type: integer, minimum: 0}
            repair_invalid_output: {type: integer, minimum: 0}
            excluded_candidates: {type: integer, minimum: 0}
            isolated_candidates: {type: integer, minimum: 0}
            accepted_candidates: {type: integer, minimum: 0}
            skipped_candidates: {type: integer, minimum: 0}
            memory_writes: {type: integer, minimum: 0}
            extraction_chunks: {type: integer, minimum: 0}
            extraction_chunk_failures: {type: integer, minimum: 0}
            dropped_candidates: {type: integer, minimum: 0}
            cross_chunk_duplicates: {type: integer, minimum: 0}
            context_only_candidates: {type: integer, minimum: 0}
        retention:
          type: object
          description: >-
            Service-derived retained candidates and fixed non-retention codes:
            explicit_exclusion, cross_chunk_context, cross_chunk_duplicate,
            candidate_limit, invalid_candidate, decision_skip, empty_extraction
            or chunk_failure. This never claims semantic correctness and never
            triggers automatic deletion or a default TTL.
          required: [retained, not_retained, by_reason, not_retained_by_reason]
          properties:
            retained: {type: integer, minimum: 0}
            not_retained: {type: integer, minimum: 0}
            by_reason:
              type: object
              additionalProperties: {type: integer, minimum: 0}
            not_retained_by_reason:
              type: object
              additionalProperties: {type: integer, minimum: 0}
        timings:
          type: object
          description: >-
            Wall-clock stage breakdown in milliseconds. queue_age_ms runs from
            durable job creation to this attempt and therefore includes earlier
            waits on a retry; the other fields measure the current attempt.
          required: [queue_age_ms, extraction_ms, normalization_ms, repair_ms,
            context_ms, decision_ms, commit_ms, total_ms]
          properties:
            queue_age_ms: {type: integer, minimum: 0}
            extraction_ms: {type: integer, minimum: 0}
            normalization_ms: {type: integer, minimum: 0}
            repair_ms: {type: integer, minimum: 0}
            context_ms: {type: integer, minimum: 0}
            decision_ms: {type: integer, minimum: 0}
            commit_ms: {type: integer, minimum: 0}
            total_ms: {type: integer, minimum: 0}
        model_usage:
          type: object
          required: [calls, input_tokens, output_tokens, total_tokens]
          properties:
            calls: {type: integer, minimum: 0}
            input_tokens: {type: integer, minimum: 0}
            output_tokens: {type: integer, minimum: 0}
            total_tokens: {type: integer, minimum: 0}
        efficiency:
          type: object
          description: Per-effective-atom call and token cost for this attempt
          required: [memories, model_calls, total_tokens, calls_per_memory, tokens_per_memory]
          properties:
            memories: {type: integer, minimum: 0}
            model_calls: {type: integer, minimum: 0}
            total_tokens: {type: integer, minimum: 0}
            calls_per_memory: {type: number, minimum: 0}
            tokens_per_memory: {type: number, minimum: 0}
        queue_age_seconds:
          type: integer
          minimum: 0
        stale_seconds:
          type: integer
          minimum: 0
        retry_reason:
          type: string
        diagnostics:
          type: array
          description: |
            Candidate-level, source-free diagnostics for the latest attempt.
            Entries contain fixed codes only; never source text or raw model
            responses.
          items:
            $ref: '#/components/schemas/ExtractionDiagnostic'
        convergence:
          type: array
          description: |
            Fixed reasons why a candidate with an existing scoped identity was
            not automatically converged. Codes never contain source text.
          items:
            $ref: '#/components/schemas/ConvergenceDiagnostic'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ConvergenceDiagnostic:
      type: object
      required: [code]
      properties:
        candidate_id:
          type: string
        group_id:
          type: string
          format: uuid
        code:
          type: string
          enum: [identity_ambiguous, missing_update_evidence, time_unknown,
            cardinality_unknown, context_truncated]

    EvolutionEvent:
      type: object
      required: [id, from_memory_id, from_version, to_memory_id, to_version, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        fact_group_id:
          type: string
          format: uuid
        from_memory_id:
          type: string
          format: uuid
        from_version:
          type: integer
          minimum: 1
        to_memory_id:
          type: string
          format: uuid
        to_version:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [change, correction, reschedule, cancel, supersede]
        reason_code:
          type: string
        created_at:
          type: string
          format: date-time

    ExtractionDiagnostic:
      type: object
      required: [code, stage, disposition]
      properties:
        candidate_id:
          type: string
          description: Service-assigned candidate ID; empty for a whole-response failure
        field:
          type: string
          description: Protocol field path such as evidence[0].segment_id
        code:
          type: string
          description: Stable diagnostic code
        stage:
          type: string
          enum: [normalize, validate, repair, isolate, extraction]
        disposition:
          type: string
          enum: [normalized, accepted, repaired, isolated, excluded]

    ConflictMember:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Version detected when the conflict was recorded
        current_version:
          type: integer
          description: Current memory version when the conflict was read

    MemberVersion:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Current version being adjudicated

    ConflictEvent:
      type: object
      required: [id, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: detected
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
        created_at:
          type: string
          format: date-time

    Conflict:
      type: object
      required: [id, status, reason_code, revision, created_at, updated_at, members]
      properties:
        id:
          type: string
          format: uuid
        fact_group_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, resolved]
        reason_code:
          type: string
          enum: [contradictory_value, uncertain_time, ambiguous_scope, complex_timeline]
        resolution:
          type: string
          description: Canonical structured adjudication JSON; never model reasoning
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/ConflictMember'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConflictEvent'

    ConflictSummary:
      type: object
      required: [id, reason_code, member_ids, has_accepted]
      properties:
        id:
          type: string
          format: uuid
        reason_code:
          type: string
          enum: [contradictory_value, uncertain_time, ambiguous_scope, complex_timeline]
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        has_accepted:
          type: boolean
        fact_group_id:
          type: string
          format: uuid

    ConflictRef:
      type: object
      required: [id, reason_code]
      properties:
        id:
          type: string
          format: uuid
        reason_code:
          type: string
          enum: [contradictory_value, uncertain_time, ambiguous_scope, complex_timeline]

    ConflictList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'

    ConflictResolveRequest:
      type: object
      required: [revision, action, member_versions]
      properties:
        revision:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [choose, timeline, separate_scope, reject_all]
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        member_versions:
          type: array
          items:
            $ref: '#/components/schemas/MemberVersion'
        separate_group:
          type: object
          properties:
            subject:
              type: string
            predicate:
              type: string
            scope:
              type: string
            cardinality:
              type: string
              enum: [single, multiple, unknown]
        timeline:
          type: array
          items:
            type: object
            required: [valid_from, valid_to]
            properties:
              memory_id:
                type: string
                format: uuid
              content:
                type: string
              valid_from:
                type: string
                format: date-time
              valid_to:
                type: string
                format: date-time
        reason:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
