name: release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify linux/amd64 and linux/arm64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.sum

      - name: Set up exact Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up exact npm version
        run: npm install --global "npm@$(node -p 'require("./web/package.json").engines.npm')"

      - name: Build and verify release binaries
        id: build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # Validate untrusted tag text in Bash before passing it to Make expansion.
        shell: bash
        run: |
          if [[ ! $RELEASE_TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must use semantic version vMAJOR.MINOR.PATCH, for example v1.2.3' >&2
            exit 1
          fi
          RELEASE_VERSION=${RELEASE_TAG#v}
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          make release VERSION="$RELEASE_VERSION"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmemd-${{ github.ref_name }}
          path: dist/${{ steps.build.outputs.version }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: dmemd-${{ github.ref_name }}
          path: dist

      - name: Publish release assets and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/dmemd_*_linux_* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "dmemd $RELEASE_TAG"
