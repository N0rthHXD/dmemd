openapi: 3.0.3
info:
  title: dmemd local memory service
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Local HTTP/1.1 JSON contract for dmemd. This document is descriptive only;
    it does not generate authentication or business validation. There is no
    authentication: Authorization headers are optional and ignored. Lists are
    returned in one response and have no pagination metadata.

    Every path below is implemented in internal/transport/http and assembled by
    internal/runtime. The HTTP contract and process lifecycle are exercised by
    the integration and end-to-end tests.

    First-release validation is documented in docs/quality.md: fixed labeled
    samples cover classification, summary constraints, deterministic conflict
    review and Skill boundaries; an opt-in 10k atomic-memory scenario covers
    governance backlog, concurrent recall and one-transaction permanent forget.
    Those results do not claim real-model semantic quality, 100k capacity, OS
    application isolation, execution certification or backup/restore.
servers:
  - url: http://127.0.0.1:18432
security: []
tags:
  - name: ingest
    description: Unified content submission and processing jobs
  - name: memories
    description: Current memories, lifecycle, history, evidence and recall
  - name: conflicts
    description: Open contradictions and explicit human adjudication
  - name: sources
    description: Original submission lookup and redaction
  - name: experiences
    description: Application-reported completion results and explicit retraction
  - name: skills
    description: Rendered guidance skills with traceable sources
  - name: health
    description: Process liveness and database readiness

paths:
  /v1/ingestions:
    post:
      tags: [ingest]
      summary: Submit arbitrary JSON content for background extraction
      description: |
        Accepts strings, objects, arrays or null as content. Saves the source and
        a queued ingest job in one transaction, then returns 202 without waiting
        for a model. app_id and external_id are optional informational source
        fields. scope_key is an optional flat scope label supplied by the calling
        context; the model never invents or promotes it. Job progress is queried
        through GET /v1/ingest-jobs/{id}; classification runs later through the
        persistent governance worker.
      operationId: createIngestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            examples:
              text:
                summary: Simple text
                value:
                  content: 以后请默认使用中文回答。
              conversation:
                summary: Conversation object
                value:
                  app_id: desktop-assistant
                  external_id: conversation-42-batch-7
                  content:
                    messages:
                      - role: user
                        content: 以后请默认使用中文回答。
                        occurred_at: '2026-10-20T02:00:00Z'
              structured:
                summary: Existing structured content
                value:
                  content:
                    preferences:
                      answer_language: zh-CN
              array:
                summary: Array content
                value:
                  content:
                    - role: user
                      content: 以后请默认使用中文回答。
                    - role: assistant
                      content: 好的。
      responses:
        '202':
          description: Source and queued job persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
              example:
                source_id: 22222222-2222-4222-8222-222222222222
                job_id: 33333333-3333-4333-8333-333333333333
                status: queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories:
    get:
      tags: [memories]
      summary: List current memories
      description: |
        Default state set is active+archived; deleted tombstones are returned
        only when states explicitly contains deleted. Default limit is 50.
        All assertion statuses are listed unless filtered. Order is
        updated_at DESC, id ASC. There is no pagination.
      operationId: listMemories
      parameters:
        - name: kinds
          in: query
          description: Comma-separated fact,preference,event,procedure
          schema:
            type: string
          example: fact,preference
        - name: states
          in: query
          description: Comma-separated active,archived,deleted
          schema:
            type: string
          example: active,archived
        - name: assertion_status
          in: query
          description: Comma-separated accepted,pending,rejected
          schema:
            type: string
          example: pending
        - name: fact_group_id
          in: query
          description: Filter by fact group id
          schema:
            type: string
          example: 55555555-5555-4555-8555-555555555555
        - name: created_by_app
          in: query
          description: Filter by the app_id captured when the memory was created
          schema:
            type: string
          example: desktop-assistant
        - name: updated_after
          in: query
          description: Inclusive RFC 3339 lower bound; invalid values are ignored
          schema:
            type: string
            format: date-time
        - name: updated_before
          in: query
          description: Inclusive RFC 3339 upper bound; invalid values are ignored
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Positive result limit; missing or invalid values use 50
          schema:
            type: integer
          example: 50
      responses:
        '200':
          description: One filtered result set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryList'
              example:
                items:
                  - id: 11111111-1111-4111-8111-111111111111
                    kind: preference
                    title: 回答语言
                    content: 用户希望默认使用中文回答。
                    state: active
                    version: 3
                    observed_at: '2026-10-20T02:00:00Z'
                    created_at: '2026-10-20T02:00:01Z'
                    updated_at: '2026-10-20T03:00:00Z'
                    created_by_app: desktop-assistant
                    origin_source_id: 22222222-2222-4222-8222-222222222222
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/recall:
    post:
      tags: [memories]
      summary: Unified layered recall for atomic memories and derived artifacts
      description: |
        The single recall entry point. layers selects atomic, summary,
        experience and skill partitions; omitting layers selects all four.
        filters.kinds and filters.states only narrow the atomic partition and
        are never applied to derived layers. scope_key filters both atomic
        memories and derived artifacts to the requested scope or the user-global
        scope; omitted scope_key disables that filter. User text is ordinary
        keywords, never FTS syntax. Hybrid and keyword modes use the same
        internal retrieval semantics as atomic search. Explicit filters.as_of
        returns atomic history only: derived partitions stay empty and include
        derived_as_of_unsupported. A derived-index failure degrades to atomic
        results with derived_unavailable and never waits for generation.
        Experiences are application reports, not verified execution results;
        skills are guidance only and carry no execution or safety certification.
      operationId: recallMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              layered:
                summary: Default all-layer recall for one project
                value:
                  query: 修改项目后应该如何验证
                  scope_key: project:dmemd
                  max_context_tokens: 3000
              atomic_only:
                summary: Explicit atomic-only recall
                value:
                  query: 项目使用什么数据库
                  scope_key: project:dmemd
                  layers: [atomic]
                  top_k: 20
              hybrid:
                summary: Hybrid atomic + summary recall
                value:
                  query: 吃饭有什么忌口
                  mode: hybrid
                  layers: [atomic, summary]
                  top_k: 10
              historical:
                summary: Atomic history at one instant; derived partitions stay empty
                value:
                  query: 用户住在哪里
                  layers: [atomic]
                  filters:
                    as_of: '2026-07-01T00:00:00Z'
                  top_k: 10
      responses:
        '200':
          description: One partitioned recall result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              example:
                memories:
                  - memory:
                      id: 11111111-1111-4111-8111-111111111111
                      kind: preference
                      title: 回答语言
                      content: 用户希望默认使用中文回答。
                      state: active
                      version: 3
                      observed_at: '2026-10-20T02:00:00Z'
                      created_at: '2026-10-20T02:00:01Z'
                      updated_at: '2026-10-20T03:00:00Z'
                      created_by_app: desktop-assistant
                      origin_source_id: 22222222-2222-4222-8222-222222222222
                    score: 0.03252247
                    snippet: 用户希望默认使用中文回答。
                    matched_terms: [回答, 语言]
                    evidence_refs:
                      - id: 44444444-4444-4444-8444-444444444444
                        source_id: 22222222-2222-4222-8222-222222222222
                    explanation:
                      ranking: rrf
                      keyword:
                        rank: 1
                        bm25: -0.0000042
                      semantic:
                        rank: 2
                        cosine: 0.93
                    temporal_status: unknown
                    conflict_refs: []
                summaries:
                  - id: 66666666-6666-4666-8666-666666666666
                    kind: topic_summary
                    version: 1
                    title: 回答偏好
                    content: 用户希望默认使用中文回答。
                    scope_key: user
                    topic: language
                    state: active
                    truncated: false
                    memory_refs:
                      - memory_id: 11111111-1111-4111-8111-111111111111
                        version: 3
                    updated_at: '2026-10-20T03:10:00Z'
                experiences: []
                skills: []
                conflicts: []
                warnings: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{id}:
    get:
      tags: [memories]
      summary: Read one derived artifact and its current revision
      operationId: getArtifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artifact state and current revision when one exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/artifacts/{id}/history/{version}:
    get:
      tags: [memories]
      summary: Read one historical derived revision
      operationId: getArtifactHistoryEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Historical revision with owning artifact state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/experiences:
    post:
      tags: [experiences]
      summary: Submit one completed application-reported result
      description: |
        Stores the original report as a source and one experience_run, then
        queues experience-case generation. outcome is the application's report
        (success, failure or unknown) and is never upgraded to a verified
        execution result. A supplied run_id is an optional deduplication key:
        repeating it returns the existing receipt without comparing the request
        body, overwriting the stored result or restoring a revoked result.
      operationId: createExperience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceSubmit'
            example:
              run_id: run-2026-10-22-1
              scope_key: project:dmemd
              goal: 修改 dmemd 后验证
              conditions: [依赖已安装]
              actions: [运行 go test, 执行构建检查]
              outcome: success
              skill_id: 88888888-8888-4888-8888-888888888888
              skill_version: 2
      responses:
        '202':
          description: Saved result receipt; duplicate run_id returns the existing receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/experiences/{id}/retract:
    post:
      tags: [experiences]
      summary: Revoke one reported result and block dependent use
      description: |
        Marks the application report revoked, disables its experience case and
        synchronously removes affected skills from default recall while queuing
        regeneration from the remaining sources. The operation is idempotent.
      operationId: retractExperience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated receipt with state=revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/skills/{id}/content:
    get:
      tags: [skills]
      summary: Read one rendered SKILL.md guidance document
      description: |
        By default returns the active current version only; a stale or disabled
        current skill is not served as active advice. An explicit positive
        version reads that immutable revision and returns its owning state.
        The content is guidance only and carries no execution or safety
        certification. Permanently cleared objects are not readable.
      operationId: getSkillContent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Rendered SKILL.md plus exact version, state and sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: Get the current memory snapshot
      description: |
        Deleted memories remain readable as tombstones by ID. Relations carry
        decision-time versions and whether either endpoint has since changed.
      operationId: getMemory
      responses:
        '200':
          description: Current snapshot and relations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDetail'
              example:
                id: 11111111-1111-4111-8111-111111111111
                kind: preference
                title: 回答语言
                content: 用户希望默认使用中文回答。
                state: active
                version: 3
                observed_at: '2026-10-20T02:00:00Z'
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T03:00:00Z'
                created_by_app: desktop-assistant
                origin_source_id: 22222222-2222-4222-8222-222222222222
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [memories]
      summary: Logically delete a memory
      description: |
        Writes a deleted tombstone and a new revision. The record, history and
        dedicated evidence remain readable; use POST /purge for permanent
        removal.
      operationId: deleteMemory
      responses:
        '200':
          description: Logical delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                id: 11111111-1111-4111-8111-111111111111
                state: deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/state:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    patch:
      tags: [memories]
      summary: Change lifecycle state only
      description: |
        Accepts only active or archived. Unknown, missing or unchanged state is
        a no-op returning the current memory. Content fields are ignored; content
        corrections must be submitted through POST /v1/ingestions.
      operationId: setMemoryState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatePatch'
            example:
              state: archived
      responses:
        '200':
          description: Updated current memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
              example:
                id: 11111111-1111-4111-8111-111111111111
                kind: preference
                title: 回答语言
                content: 用户希望默认使用中文回答。
                state: archived
                version: 4
                observed_at: '2026-10-20T02:00:00Z'
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T04:00:00Z'
                created_by_app: desktop-assistant
                origin_source_id: 22222222-2222-4222-8222-222222222222
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/purge:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    post:
      tags: [memories]
      summary: Permanently purge a memory
      description: |
        Permanently removes the current record, history and dedicated evidence;
        shared sources remain. This operation has no request body.
      operationId: purgeMemory
      responses:
        '200':
          description: Purge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResponse'
              example:
                id: 11111111-1111-4111-8111-111111111111
                purged: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: List complete revision history
      description: Newest version first; default limit 50; no pagination.
      operationId: listMemoryHistory
      parameters:
        - name: limit
          in: query
          description: Positive result limit; missing or invalid values use 50
          schema:
            type: integer
          example: 50
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
              example:
                items:
                  - memory_id: 11111111-1111-4111-8111-111111111111
                    version: 3
                    operation: update
                    reason: 用户更正回答语言
                    snapshot:
                      id: 11111111-1111-4111-8111-111111111111
                      kind: preference
                      title: 回答语言
                      content: 用户希望默认使用中文回答。
                      state: active
                      version: 3
                      observed_at: '2026-10-20T02:00:00Z'
                      created_at: '2026-10-20T02:00:01Z'
                      updated_at: '2026-10-20T03:00:00Z'
                      created_by_app: desktop-assistant
                      origin_source_id: 22222222-2222-4222-8222-222222222222
                    evidence:
                      - id: 44444444-4444-4444-8444-444444444444
                        source_id: 22222222-2222-4222-8222-222222222222
                        message_id: msg-1
                        quote: 以后请默认使用中文回答。
                        location:
                          field: messages.0.content
                          start: 0
                          end: 13
                        model_name: example-model
                        redacted: false
                        created_at: '2026-10-20T02:00:01Z'
                    created_at: '2026-10-20T03:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history/{version}:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [memories]
      summary: Get one complete historical version
      operationId: getMemoryHistoryEntry
      responses:
        '200':
          description: Version snapshot and complete evidence set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/history/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [memories]
      summary: Restore a historical version as a new current version
      description: |
        Never overwrites history. Restored state is active; assertion status is
        not promoted, and a pending/rejected historical assertion keeps its
        status. If restoring an accepted assertion would create an unmarked
        conflict in the current fact group, the whole restore returns 409 and
        no version is written. A missing or unknown version returns 404.
      operationId: restoreMemoryVersion
      responses:
        '200':
          description: Restored current memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
              example:
                id: 11111111-1111-4111-8111-111111111111
                kind: preference
                title: 回答语言
                content: 用户希望默认使用中文回答。
                state: active
                version: 4
                observed_at: '2026-10-20T02:00:00Z'
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T05:00:00Z'
                created_by_app: desktop-assistant
                origin_source_id: 22222222-2222-4222-8222-222222222222
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictStale'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memories/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/MemoryID'
    get:
      tags: [memories]
      summary: Get the current or a historical version evidence set
      description: |
        version absent, 0 or invalid means current. A positive nonexistent
        version returns 404. Redacted evidence keeps its ID and source_id but
        never returns quote or location copies.
      operationId: getMemoryEvidence
      parameters:
        - name: version
          in: query
          description: Target version; absent/0/invalid means current version
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Complete evidence set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceList'
              example:
                items:
                  - id: 44444444-4444-4444-8444-444444444444
                    source_id: 22222222-2222-4222-8222-222222222222
                    message_id: msg-1
                    quote: 以后请默认使用中文回答。
                    location:
                      field: messages.0.content
                      start: 0
                      end: 13
                    model_name: example-model
                    redacted: false
                    created_at: '2026-10-20T02:00:01Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts:
    get:
      tags: [conflicts]
      summary: List conflicts
      description: Fixed updated_at DESC, id ASC ordering with one result set.
      operationId: listConflicts
      parameters:
        - name: status
          in: query
          description: open or resolved; default open
          schema:
            type: string
            enum: [open, resolved]
            default: open
        - name: limit
          in: query
          description: Positive result limit; missing or invalid values use 50
          schema:
            type: integer
      responses:
        '200':
          description: One filtered conflict set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [conflicts]
      summary: Get a conflict with members and audit events
      operationId: getConflict
      responses:
        '200':
          description: Conflict detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/memory-conflicts/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [conflicts]
      summary: Explicitly adjudicate one conflict
      description: |
        The client submits the conflict revision and the member versions it
        inspected. A stale conflict or member returns 409; malformed actions or
        timelines return 400. Resolving an already resolved conflict with the
        same payload returns the existing result; a different result returns 409.
      operationId: resolveConflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolveRequest'
      responses:
        '200':
          description: Resolved conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictStale'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/forget:
    post:
      tags: [memories]
      summary: Permanently forget atomic memories, sources or application reports
      description: |
        Removes every requested leaf and, before any foreign-key cascade runs,
        enumerates and removes dependent derived objects, their history, FTS
        rows and dependency edges. Forgetting a source expands to all
        associated memories and application reports; forgetting a report also
        removes its dedicated source. The whole request is one transaction: an
        unknown identifier or storage failure rolls back every listed target.
        Historical and rendered derived reads return 404 after commit.
      operationId: forget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetRequest'
            example:
              source_ids: [22222222-2222-4222-8222-222222222222]
              experience_ids: [33333333-3333-4333-8333-333333333333]
      responses:
        '200':
          description: Identifiers removed by the committed transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgetResponse'
              example:
                memory_ids: [11111111-1111-4111-8111-111111111111]
                source_ids: [22222222-2222-4222-8222-222222222222]
                experience_ids: [33333333-3333-4333-8333-333333333333]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [sources]
      summary: Get a submission and its original content
      description: Redacted sources retain the ID and status but omit content.
      operationId: getSource
      responses:
        '200':
          description: Source record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
              examples:
                original:
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    app_id: desktop-assistant
                    external_id: conversation-42-batch-7
                    content:
                      messages:
                        - role: user
                          content: 以后请默认使用中文回答。
                    redacted: false
                    created_at: '2026-10-20T02:00:01Z'
                redacted:
                  value:
                    id: 22222222-2222-4222-8222-222222222222
                    redacted: true
                    redacted_at: '2026-10-20T06:00:00Z'
                    created_at: '2026-10-20T02:00:01Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [sources]
      summary: Redact original content and cancel unfinished jobs
      description: |
        Clears original content and every evidence quote/location copy in one
        transaction, keeps the source ID and redacted status, cancels queued or
        running jobs, scrubs terminal job error summaries that could retain
        original text, and leaves already formed memory text intact.
      operationId: redactSource
      responses:
        '200':
          description: Redaction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactResponse'
              example:
                id: 22222222-2222-4222-8222-222222222222
                redacted: true
                cancelled_jobs: 1
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/ingest-jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [ingest]
      summary: Get processing status and result summary
      operationId: getIngestJob
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                id: 33333333-3333-4333-8333-333333333333
                source_id: 22222222-2222-4222-8222-222222222222
                status: succeeded
                attempts: 1
                memory_ids: [11111111-1111-4111-8111-111111111111]
                created_at: '2026-10-20T02:00:01Z'
                updated_at: '2026-10-20T02:00:03Z'
                started_at: '2026-10-20T02:00:02Z'
                finished_at: '2026-10-20T02:00:03Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /healthz:
    get:
      tags: [health]
      summary: Process liveness
      operationId: healthz
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok

  /readyz:
    get:
      tags: [health]
      summary: Database readiness
      description: A model outage does not affect readiness.
      operationId: readyz
      responses:
        '200':
          description: Database ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ready
        '503':
          description: Database not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: unavailable

components:
  parameters:
    MemoryID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
      example: 2

  responses:
    BadRequest:
      description: Request body is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 请求体不是有效的 JSON。
    NotFound:
      description: Requested resource or version does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 资源不存在。
    InternalError:
      description: Internal execution failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 内部执行失败。
    ConflictStale:
      description: The conflict, member versions or current accepted facts changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 冲突或版本已变化，请重新读取。
            code: conflict_stale
    Unavailable:
      description: Service or database is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 服务暂不可用。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: 请求体不是有效的 JSON。
        code:
          type: string
          description: Stable code for conflict-specific failures
          example: conflict_stale

    SubmitRequest:
      type: object
      description: |
        All fields are optional. content may be any JSON value, including a
        string, object, array, number, boolean or null.
      properties:
        app_id:
          type: string
          description: Optional informational source name; no identity or uniqueness
          example: desktop-assistant
        external_id:
          type: string
          description: Optional external reference; no uniqueness constraint
          example: conversation-42-batch-7
        scope_key:
          type: string
          description: |
            Optional flat scope label such as user or project:dmemd. Empty means
            unknown; it is never silently promoted to a global scope.
          example: project:dmemd
        content:
          description: Arbitrary JSON content, including null
      additionalProperties: true

    SubmitResponse:
      type: object
      required: [source_id, job_id, status]
      properties:
        source_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]

    Memory:
      type: object
      required: [id, kind, title, content, state, assertion_status, version, observed_at,
        valid_from_basis, valid_to_basis, topics, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [fact, preference, event, procedure]
        title:
          type: string
        content:
          type: string
        state:
          type: string
          enum: [active, archived, deleted]
        assertion_status:
          type: string
          description: accepted is system-adopted, pending needs adjudication, rejected is audited but not recalled
          enum: [accepted, pending, rejected]
        version:
          type: integer
          minimum: 1
        observed_at:
          type: string
          format: date-time
        valid_from:
          type: string
          format: date-time
          nullable: true
          description: Half-open interval start; absent means unknown, not "always valid"
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Half-open interval end; absent means unknown
        valid_from_basis:
          type: string
          enum: [explicit, inferred, unknown]
        valid_to_basis:
          type: string
          enum: [explicit, inferred, unknown]
        fact_group_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_app:
          type: string
          description: app_id captured at creation; preserved by updates and restores
        origin_source_id:
          type: string
          format: uuid
        scope_key:
          type: string
          description: Flat scope label; absent or empty means unknown
        topics:
          type: array
          description: Normalized flat topic labels; never a hierarchy
          items:
            type: string
          example: [go, sqlite]

    Relation:
      type: object
      required: [id, from_memory_id, from_version, to_memory_id, to_version, kind,
        created_at, from_version_changed, to_version_changed]
      properties:
        id:
          type: string
          format: uuid
        from_memory_id:
          type: string
          format: uuid
        from_version:
          type: integer
        to_memory_id:
          type: string
          format: uuid
        to_version:
          type: integer
        kind:
          type: string
          enum: [supersedes]
        created_at:
          type: string
          format: date-time
        from_version_changed:
          type: boolean
        to_version_changed:
          type: boolean

    MemoryDetail:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          required: [relations]
          properties:
            relations:
              type: array
              items:
                $ref: '#/components/schemas/Relation'

    MemoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'

    StatePatch:
      type: object
      description: Only active and archived are accepted; other fields are ignored.
      properties:
        state:
          type: string
          enum: [active, archived]

    DeleteResponse:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [deleted]

    PurgeResponse:
      type: object
      required: [id, purged]
      properties:
        id:
          type: string
          format: uuid
        purged:
          type: boolean
          enum: [true]

    Revision:
      type: object
      required: [memory_id, version, operation, snapshot, evidence, created_at]
      properties:
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        operation:
          type: string
          enum: [create, update, add_evidence, archive, activate, delete, restore,
            correct, change, resolve, classify]
        reason:
          type: string
        snapshot:
          $ref: '#/components/schemas/Memory'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        created_at:
          type: string
          format: date-time

    RevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'

    Evidence:
      type: object
      required: [id, source_id, redacted, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        message_id:
          type: string
        quote:
          type: string
          description: Absent after source redaction
        location:
          $ref: '#/components/schemas/Location'
        model_name:
          type: string
        redacted:
          type: boolean
        redacted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Location:
      type: object
      properties:
        field:
          type: string
          example: messages.0.content
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0

    EvidenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'

    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: >-
            Ordinary keywords; empty or punctuation-only input returns empty
            partitions. Whitespace and punctuation separate groups; dictionary
            terms are matched independently. The same text is normalized for
            semantic retrieval without the document template.
        scope_key:
          type: string
          description: >-
            Optional flat scope. When supplied, atomic and derived results must
            belong to this scope or the user-global scope. Omitted means no
            scope filter. Unknown scope values are never promoted to global.
        layers:
          type: array
          description: >-
            Knowledge layers to recall. Omitted selects all four; an explicit
            list selects only those partitions. values other than the four
            fixed names return 400.
          items:
            type: string
            enum: [atomic, summary, experience, skill]
        mode:
          type: string
          enum: [keyword, hybrid]
          default: keyword
          description: >-
            Keyword uses FTS5/BM25 only. Hybrid runs both atomic recall paths and
            fuses them with RRF; semantic failures degrade to keyword with a
            warning. Derived layers always use their own FTS index.
        match:
          type: string
          enum: [all, any]
          default: any
          description: >-
            Omitted, empty, or unknown values behave as any. Keyword-mode any
            removes controlled question, auxiliary, and generic terms, then
            matches any remaining term; recalled candidates are coverage-reranked
            but are never dropped for low coverage. all keeps the original terms
            and requires every one. Only keyword retrieval paths use it.
        filters:
          $ref: '#/components/schemas/SearchFilters'
        top_k:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Default 20 for missing or non-positive values; above 100 is 400.
            The bound applies per selected layer.
        max_context_tokens:
          type: integer
          minimum: 0
          description: >-
            Optional conservative budget using a rune-based estimate, never a
            model-tokenizer-exact count. Exceeding it truncates later items and
            emits context_budget_truncated.
        explain:
          type: boolean
          default: false

    SearchFilters:
      type: object
      properties:
        kinds:
          type: array
          description: Recognized values are fact, preference, event, procedure
          items:
            type: string
        states:
          type: array
          description: Default is [active]; archived is opt-in; deleted is never returned
          items:
            type: string
        as_of:
          type: string
          format: date-time
          description: >-
            Fact validity instant. Missing pins request start once; an explicit
            malformed value returns 400. Independent from updated_after/before.
        created_by_app:
          type: string
        updated_after:
          type: string
          format: date-time
        updated_before:
          type: string
          format: date-time

    SearchResponse:
      type: object
      required: [memories, summaries, experiences, skills, conflicts, warnings]
      properties:
        memories:
          type: array
          description: Atomic fact, preference, event and procedure results.
          items:
            $ref: '#/components/schemas/SearchItem'
        summaries:
          type: array
          description: Active topic_summary and profile artifacts.
          items:
            $ref: '#/components/schemas/ArtifactItem'
        experiences:
          type: array
          description: >-
            Active experience_case artifacts generated from application-reported
            results. Outcomes are reports, not verified execution results.
          items:
            $ref: '#/components/schemas/ArtifactItem'
        skills:
          type: array
          description: >-
            Active guidance-only skills with traceable sources. They carry no
            execution, truth or safety certification.
          items:
            $ref: '#/components/schemas/ArtifactItem'
        conflicts:
          type: array
          description: >-
            Open conflicts touching this atomic query and as_of instant. Pending
            member text is never copied into ordinary items.
          items:
            $ref: '#/components/schemas/ConflictSummary'
        warnings:
          type: array
          description: Stable deduplicated warning codes.
          items:
            type: string
            enum: [semantic_unavailable, semantic_timeout, fact_conflict,
              conflict_results_truncated, derived_as_of_unsupported,
              derived_unavailable, context_budget_truncated]

    ArtifactMemoryRef:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
        version:
          type: integer
          minimum: 1

    ArtifactRunRef:
      type: object
      required: [experience_id]
      properties:
        experience_id:
          type: string
          description: Service-internal recorded application result identifier

    ExperienceSubmit:
      type: object
      required: [goal]
      properties:
        run_id:
          type: string
          description: Optional client deduplication key; repeat returns the existing receipt
        app_id:
          type: string
        external_id:
          type: string
        scope_key:
          type: string
        goal:
          type: string
        conditions:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        outcome:
          type: string
          enum: [success, failure, unknown]
          description: Application's own report; missing means unknown
        skill_id:
          type: string
          description: Optional exact skill object the run reports against
        skill_version:
          type: integer
          minimum: 0
        content:
          type: object
          additionalProperties: true
          description: Optional original report JSON stored as the source payload

    ExperienceReceipt:
      type: object
      required: [id, source_id, outcome, state, created_at, updated_at]
      properties:
        id:
          type: string
        source_id:
          type: string
        run_id:
          type: string
        outcome:
          type: string
          enum: [success, failure, unknown]
        state:
          type: string
          enum: [recorded, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SkillContent:
      type: object
      required: [id, version, state, name, description, content, truncated,
        memory_refs, run_refs]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [active, stale, disabled]
        name:
          type: string
        description:
          type: string
        content:
          type: string
          description: Rendered SKILL.md with name/description frontmatter
        truncated:
          type: boolean
        memory_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMemoryRef'
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRunRef'

    ArtifactItem:
      type: object
      required: [id, kind, version, title, content, state, truncated,
        memory_refs, run_refs, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [topic_summary, profile, experience_case, skill]
        version:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          type: string
        payload:
          type: object
          description: Structured experience/skill payload when the kind has one
        scope_key:
          type: string
        topic:
          type: string
        state:
          type: string
          enum: [active, stale, disabled]
        truncated:
          type: boolean
          description: True when this version covers only a bounded subset of eligible input
        memory_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMemoryRef'
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRunRef'
        updated_at:
          type: string
          format: date-time
        score:
          type: number
          description: Derived FTS ranking score; larger is more relevant within this partition

    ArtifactMeta:
      type: object
      required: [id, kind, target_key, current_version, state, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [topic_summary, profile, experience_case, skill]
        target_key:
          type: string
        scope_key:
          type: string
        topic:
          type: string
        current_version:
          type: integer
          minimum: 0
          description: Zero only when no usable version has been generated
        state:
          type: string
          enum: [active, stale, disabled]
        updated_at:
          type: string
          format: date-time

    ArtifactRevision:
      type: object
      required: [artifact_id, version, title, content, content_hash, generator,
        protocol_version, truncated, memory_refs, run_refs, created_at]
      properties:
        artifact_id:
          type: string
        version:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          type: string
        payload:
          type: object
          description: Structured experience-case or skill payload; summaries use {}
        content_hash:
          type: string
        generator:
          type: string
        protocol_version:
          type: string
        reason_code:
          type: string
          description: Fixed code such as input_truncated
        truncated:
          type: boolean
        memory_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactMemoryRef'
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRunRef'
        created_at:
          type: string
          format: date-time

    ArtifactDetail:
      type: object
      required: [artifact]
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactMeta'
        revision:
          $ref: '#/components/schemas/ArtifactRevision'

    SearchItem:
      type: object
      required: [memory, score, snippet, matched_terms, evidence_refs,
        temporal_status, conflict_refs]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
        score:
          type: number
          description: >-
            Keyword-mode any uses a bounded BM25-rank and term-coverage fusion;
            explicit all uses -bm25. Hybrid mode uses the RRF score. Larger is
            more relevant only within this result set.
        snippet:
          type: string
          description: >-
            Readable original content, never tokenized index text or HTML;
            long content is truncated around the first match with an ellipsis.
        matched_terms:
          type: array
          description: >-
            Keyword query groups actually found in the title or content.
            Keyword-mode any returns the selected effective terms; all keeps the
            original terms. Semantic-only results always return an empty array.
          items:
            type: string
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
        explanation:
          $ref: '#/components/schemas/Explanation'
        temporal_status:
          type: string
          enum: [within_bounds, unknown]
          description: Describes known interval bounds, not objective truth
        conflict_refs:
          type: array
          items:
            $ref: '#/components/schemas/ConflictRef'

    EvidenceRef:
      type: object
      required: [id, source_id]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid

    Explanation:
      type: object
      required: [ranking]
      properties:
        ranking:
          type: string
          enum: [bm25, rrf]
        field_weights:
          type: array
          description: Present only for keyword-mode BM25 ranking
          minItems: 2
          maxItems: 2
          items:
            type: integer
          example: [4, 1]
        keyword:
          type: object
          description: Present when the keyword path recalled this item
          required: [rank, bm25]
          properties:
            rank:
              type: integer
              minimum: 1
            bm25:
              type: number
        semantic:
          type: object
          description: Present when the semantic path recalled this item
          required: [rank, cosine]
          properties:
            rank:
              type: integer
              minimum: 1
            cosine:
              type: number

    Source:
      type: object
      required: [id, redacted, created_at]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
        external_id:
          type: string
        scope_key:
          type: string
          description: Optional flat source scope label
        content:
          description: Original JSON; omitted after redaction
        redacted:
          type: boolean
        redacted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    RedactResponse:
      type: object
      required: [id, redacted, cancelled_jobs]
      properties:
        id:
          type: string
          format: uuid
        redacted:
          type: boolean
          enum: [true]
        cancelled_jobs:
          type: integer
          minimum: 0

    ForgetRequest:
      type: object
      description: At least one identifier is required.
      properties:
        memory_ids:
          type: array
          items:
            type: string
            format: uuid
        source_ids:
          type: array
          items:
            type: string
            format: uuid
        experience_ids:
          type: array
          items:
            type: string
            format: uuid

    ForgetResponse:
      type: object
      required: [memory_ids, source_ids, experience_ids]
      description: Sorted identifiers removed by the committed transaction.
      properties:
        memory_ids:
          type: array
          items:
            type: string
            format: uuid
        source_ids:
          type: array
          items:
            type: string
            format: uuid
        experience_ids:
          type: array
          items:
            type: string
            format: uuid

    Job:
      type: object
      required: [id, source_id, status, attempts, protocol_failures, memory_ids, conflict_ids,
        pending_memory_ids, warnings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            waiting means the task is parked. transient waits resume
            automatically with bounded backoff; configuration waits are
            reevaluated after a restart; protocol waits fail after three
            consecutive malformed responses.
          enum: [queued, running, waiting, succeeded, failed, cancelled]
        attempts:
          type: integer
          minimum: 0
        protocol_failures:
          type: integer
          minimum: 0
          description: Consecutive protocol failures for the current input
        wait_reason:
          type: string
          enum: [transient, configuration, protocol]
          description: Fixed wait reason; never contains source or provider text
        next_attempt_at:
          type: string
          format: date-time
        error:
          type: string
          description: Sanitized failure summary; never a raw model response
        memory_ids:
          type: array
          description: All memories created or revised by this job
          items:
            type: string
            format: uuid
        conflict_ids:
          type: array
          items:
            type: string
            format: uuid
        pending_memory_ids:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          description: Stable warning codes such as fact_conflict or context_truncated
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ConflictMember:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Version detected when the conflict was recorded
        current_version:
          type: integer
          description: Current memory version when the conflict was read

    MemberVersion:
      type: object
      required: [memory_id, version]
      properties:
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Current version being adjudicated

    ConflictEvent:
      type: object
      required: [id, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: detected
        memory_id:
          type: string
          format: uuid
        version:
          type: integer
        created_at:
          type: string
          format: date-time

    Conflict:
      type: object
      required: [id, status, reason_code, revision, created_at, updated_at, members]
      properties:
        id:
          type: string
          format: uuid
        fact_group_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, resolved]
        reason_code:
          type: string
          enum: [contradictory_value, uncertain_time, ambiguous_scope, complex_timeline]
        resolution:
          type: string
          description: Canonical structured adjudication JSON; never model reasoning
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/ConflictMember'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConflictEvent'

    ConflictSummary:
      type: object
      required: [id, reason_code, member_ids, has_accepted]
      properties:
        id:
          type: string
          format: uuid
        reason_code:
          type: string
          enum: [contradictory_value, uncertain_time, ambiguous_scope, complex_timeline]
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        has_accepted:
          type: boolean
        fact_group_id:
          type: string
          format: uuid

    ConflictRef:
      type: object
      required: [id, reason_code]
      properties:
        id:
          type: string
          format: uuid
        reason_code:
          type: string
          enum: [contradictory_value, uncertain_time, ambiguous_scope, complex_timeline]

    ConflictList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'

    ConflictResolveRequest:
      type: object
      required: [revision, action, member_versions]
      properties:
        revision:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [choose, timeline, separate_scope, reject_all]
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        member_versions:
          type: array
          items:
            $ref: '#/components/schemas/MemberVersion'
        separate_group:
          type: object
          properties:
            subject:
              type: string
            predicate:
              type: string
            scope:
              type: string
            cardinality:
              type: string
              enum: [single, multiple, unknown]
        timeline:
          type: array
          items:
            type: object
            required: [valid_from, valid_to]
            properties:
              memory_id:
                type: string
                format: uuid
              content:
                type: string
              valid_from:
                type: string
                format: date-time
              valid_to:
                type: string
                format: date-time
        reason:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
